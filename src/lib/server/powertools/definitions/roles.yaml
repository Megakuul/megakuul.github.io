    - id: iam-role-eks-pod
      title: EKS Pod Identity
      env:
        - name: ROLE_NAME
          example: my-app-role
          required: true
        - name: CLUSTER_NAME
          example: my-cluster
          required: true
        - name: NAMESPACE
          example: app
          required: true
        - name: SERVICE_ACCOUNT
          example: worker
          required: true
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: role-eks-pod
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          RoleName:
            Type: String
          ClusterName:
            Type: String
          Namespace:
            Type: String
          ServiceAccount:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Role:
            Type: AWS::IAM::Role
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              RoleName:
                Ref: RoleName
              AssumeRolePolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: pods.eks.amazonaws.com
                    Action:
                      - sts:AssumeRole
                      - sts:TagSession
                    Condition:
                      StringEquals:
                        aws:RequestTag/eks-cluster-arn:
                          Fn::Sub: arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
                        aws:RequestTag/kubernetes-namespace:
                          Fn::Sub: ${Namespace}
                        aws:RequestTag/kubernetes-service-account:
                          Fn::Sub: ${ServiceAccount}
              ManagedPolicyArns: []
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Permissions:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              ManagedPolicyName:
                Fn::Sub: ${RoleName}-permissions
              Path: /powertools/
              Description: Application permissions for this role.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
