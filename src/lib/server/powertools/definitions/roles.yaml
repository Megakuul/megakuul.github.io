- id: iam-roles
  title: Roles
  recipes:
    - id: iam-role-lambda
      title: Lambda VPC
      env:
        - name: ROLE_NAME
          example: my-app-role
          required: true
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: role-lambda
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          RoleName:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Role:
            Type: AWS::IAM::Role
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              RoleName:
                Ref: RoleName
              AssumeRolePolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: lambda.amazonaws.com
                    Action:
                      - sts:AssumeRole
              ManagedPolicyArns:
                - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Permissions:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              ManagedPolicyName:
                Fn::Sub: ${RoleName}-permissions
              Path: /powertools/
              Description: Application permissions for this role.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Sid: EmptyPermissions
                    Effect: Deny
                    NotAction: '*'
                    Resource: '*'
              Roles:
                - Ref: Role
        Outputs:
          RoleArn:
            Value:
              Fn::GetAtt:
                - Role
                - Arn
          PolicyArn:
            Value:
              Ref: Permissions
