              - arn:aws:redshift:eu-central-1:111122223333:dbname:my-warehouse/my_database
            Condition:
              StringEquals:
                redshift:DbUser: app_user
                redshift:DbName: my_database
    - id: iam-access-redshift-data
      title: Redshift Data API
      policy:
        Version: 2012-10-17
