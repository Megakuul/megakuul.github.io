              - dynamodb:DescribeStream
              - dynamodb:GetRecords
              - dynamodb:GetShardIterator
            Resource: arn:aws:dynamodb:eu-central-1:111122223333:table/my-table/stream/2026-09-09T00:00:00.000
          - Effect: Allow
            Action:
              - dynamodb:ListStreams
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: eu-central-1
    - id: iam-access-rds-connect
