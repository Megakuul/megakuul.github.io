- id: iam-access-observability
  title: Observability policies
  recipes:
    - id: iam-access-logs-write
      title: CloudWatch Logs Write
      policy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: arn:aws:logs:eu-central-1:111122223333:log-group:/app/my-app:log-stream:*
    - id: iam-access-logs-stream
      title: CloudWatch Log Stream Write
      policy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - logs:PutLogEvents
            Resource: arn:aws:logs:eu-central-1:111122223333:log-group:/app/my-app:log-stream:my-stream
    - id: iam-access-flow-logs
      title: VPC Flow Logs
      policy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: arn:aws:logs:eu-central-1:111122223333:log-group:/app/my-app:log-stream:*
          - Effect: Allow
            Action:
              - logs:DescribeLogStreams
            Resource: arn:aws:logs:eu-central-1:111122223333:log-group:/app/my-app:*
          - Effect: Allow
            Action:
              - logs:DescribeLogGroups
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: eu-central-1
    - id: iam-access-step-functions-logs
      title: Step Functions Logging
      policy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: arn:aws:logs:eu-central-1:111122223333:log-group:/app/my-app:log-stream:*
          - Effect: Allow
            Action:
              - logs:CreateLogDelivery
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: eu-central-1
    - id: iam-access-metrics-write
      title: CloudWatch Metrics
      policy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - cloudwatch:PutMetricData
            Resource: '*'
            Condition:
              StringEquals:
                cloudwatch:namespace: MyApp/Pipeline
                aws:RequestedRegion: eu-central-1
    - id: iam-access-xray-write
      title: X-Ray
      policy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: eu-central-1
- id: iam-access-storage
  title: Storage policies
  recipes:
    - id: iam-access-s3-read
      title: S3 Read
      policy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
            Resource: arn:aws:s3:::my-app-bucket/uploads/*
            Condition:
              Bool:
                aws:SecureTransport: 'true'
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource: arn:aws:s3:::my-app-bucket
            Condition:
              StringLike:
                s3:prefix:
                  - uploads/*
              Bool:
                aws:SecureTransport: 'true'
    - id: iam-access-s3-write
      title: S3 Write
      policy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:AbortMultipartUpload
              - s3:ListMultipartUploadParts
            Resource: arn:aws:s3:::my-app-bucket/uploads/*
            Condition:
              Bool:
                aws:SecureTransport: 'true'
    - id: iam-access-s3-delete
      title: S3 Delete
      policy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - s3:DeleteObject
            Resource: arn:aws:s3:::my-app-bucket/uploads/*
            Condition:
              Bool:
                aws:SecureTransport: 'true'
    - id: iam-access-efs-read
      title: EFS Read
      policy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - elasticfilesystem:ClientMount
            Resource: arn:aws:elasticfilesystem:eu-central-1:111122223333:file-system/fs-0123456789abcdef0
            Condition:
              StringEquals:
                elasticfilesystem:AccessPointArn: arn:aws:elasticfilesystem:eu-central-1:111122223333:access-point/fsap-0123456789abcdef0
              Bool:
                aws:SecureTransport: 'true'
                elasticfilesystem:AccessedViaMountTarget: 'true'
    - id: iam-access-efs-write
      title: EFS Write
      policy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - elasticfilesystem:ClientMount
              - elasticfilesystem:ClientWrite
            Resource: arn:aws:elasticfilesystem:eu-central-1:111122223333:file-system/fs-0123456789abcdef0
            Condition:
              StringEquals:
                elasticfilesystem:AccessPointArn: arn:aws:elasticfilesystem:eu-central-1:111122223333:access-point/fsap-0123456789abcdef0
              Bool:
                aws:SecureTransport: 'true'
                elasticfilesystem:AccessedViaMountTarget: 'true'
