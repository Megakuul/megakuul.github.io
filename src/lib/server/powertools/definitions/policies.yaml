      policy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - rds-data:ExecuteStatement
              - rds-data:BatchExecuteStatement
              - rds-data:BeginTransaction
              - rds-data:CommitTransaction
              - rds-data:RollbackTransaction
            Resource: arn:aws:rds:eu-central-1:111122223333:cluster:my-cluster
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: arn:aws:secretsmanager:eu-central-1:111122223333:secret:my-app/database-AbCdEf
    - id: iam-access-redshift-connect
      title: Redshift IAM
      policy:
        Version: 2012-10-17
