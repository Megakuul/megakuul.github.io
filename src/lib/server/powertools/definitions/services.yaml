    - id: service-ecr
      title: ECR
      env:
        - name: NAME
          example: my-app/backend
          required: true
          type: string
          hint: Immutable tags, scanning, lifecycle and a TLS-only repository policy. Pull/push authorization still comes from IAM.
          pattern: '[a-z0-9]+(?:[._/-][a-z0-9]+)*'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: ecr
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Repository:
            Type: AWS::ECR::Repository
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              RepositoryName:
                Ref: Name
              RepositoryPolicyText:
                Version: '2012-10-17'
                Statement:
                  - Sid: RequireTLS
                    Effect: Deny
                    Principal: '*'
                    Action: ecr:*
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                        aws:PrincipalIsAWSService: 'false'
              ImageTagMutability: IMMUTABLE
              ImageScanningConfiguration:
                ScanOnPush: true
              EncryptionConfiguration:
                EncryptionType: AES256
              LifecyclePolicy:
                LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Expire old untagged images","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":30},"action":{"type":"expire"}}]}'
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          EcrPullAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Authenticate and pull images from this repository.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action: ecr:GetAuthorizationToken
                    Resource: '*'
                    Condition:
                      StringEquals:
                        aws:RequestedRegion:
                          Ref: AWS::Region
                  - Effect: Allow
                    Action:
                      - ecr:BatchCheckLayerAvailability
                      - ecr:GetDownloadUrlForLayer
                      - ecr:BatchGetImage
                    Resource:
                      Fn::GetAtt:
                        - Repository
                        - Arn
          EcrPushAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Authenticate, pull and push images in this repository.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action: ecr:GetAuthorizationToken
                    Resource: '*'
                    Condition:
                      StringEquals:
                        aws:RequestedRegion:
                          Ref: AWS::Region
                  - Effect: Allow
                    Action:
                      - ecr:BatchCheckLayerAvailability
                      - ecr:GetDownloadUrlForLayer
                      - ecr:BatchGetImage
                      - ecr:InitiateLayerUpload
                      - ecr:UploadLayerPart
                      - ecr:CompleteLayerUpload
                      - ecr:PutImage
                    Resource:
                      Fn::GetAtt:
                        - Repository
                        - Arn
        Outputs:
          RepositoryArn:
            Value:
              Fn::GetAtt:
                - Repository
                - Arn
          EcrPullAccessArn:
            Description: 'Optional policy: Authenticate and pull images from this repository. Attach to a role, user or group when needed.'
            Value:
              Ref: EcrPullAccess
          EcrPushAccessArn:
            Description: 'Optional policy: Authenticate, pull and push images in this repository. Attach to a role, user or group when needed.'
            Value:
              Ref: EcrPushAccess
    - id: service-ecs
      title: ECS
      env:
        - name: NAME
          example: my-cluster
          required: true
          type: string
          hint: Enhanced Insights and 30-day Insights/Exec logs. Configure task roles, container security and service networking separately.
          pattern: '[A-Za-z0-9_-]{1,64}'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: ecs
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Description: Fargate cluster with enhanced Container Insights and retained, protected 30-day performance/Exec logs. Task definitions, service networking, application logging and ECS Exec task permissions must be configured with the workload.
        Parameters:
          Name:
            Type: String
            AllowedPattern: '[A-Za-z0-9_-]{1,64}'
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          ExecLogs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: /aws/ecs/${Name}/exec
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          InsightsLogs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: /aws/ecs/containerinsights/${Name}/performance
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Cluster:
            Type: AWS::ECS::Cluster
            DependsOn: InsightsLogs
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              ClusterName:
                Ref: Name
              Configuration:
                ExecuteCommandConfiguration:
                  Logging: OVERRIDE
                  LogConfiguration:
                    CloudWatchLogGroupName:
                      Ref: ExecLogs
              ClusterSettings:
                - Name: containerInsights
                  Value: enhanced
              CapacityProviders:
                - FARGATE
                - FARGATE_SPOT
              DefaultCapacityProviderStrategy:
                - CapacityProvider: FARGATE
                  Weight: 1
                  Base: 1
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          EcsRunAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Run NAME-prefixed task families in this cluster; pass only NAME-prefixed task roles.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action: ecs:RunTask
                    Resource:
                      Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${Name}-*:*
                    Condition:
                      ArnEquals:
                        ecs:cluster:
                          Fn::GetAtt:
                            - Cluster
                            - Arn
                  - Effect: Allow
                    Action: iam:PassRole
                    Resource:
                      Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Name}-*
                    Condition:
                      StringEquals:
                        iam:PassedToService: ecs-tasks.amazonaws.com
          EcsTasksAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Describe this cluster and inspect or stop its tasks.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action: ecs:DescribeClusters
                    Resource:
                      Fn::GetAtt:
                        - Cluster
                        - Arn
                  - Effect: Allow
                    Action:
                      - ecs:DescribeTasks
                      - ecs:StopTask
                    Resource:
                      Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${Name}/*
        Outputs:
          ClusterArn:
            Value:
              Fn::GetAtt:
                - Cluster
                - Arn
          EcsRunAccessArn:
            Description: 'Optional policy: Run NAME-prefixed task families in this cluster; pass only NAME-prefixed task roles. Attach to a role, user or group when needed.'
            Value:
              Ref: EcsRunAccess
          EcsTasksAccessArn:
            Description: 'Optional policy: Describe this cluster and inspect or stop its tasks. Attach to a role, user or group when needed.'
            Value:
              Ref: EcsTasksAccess
