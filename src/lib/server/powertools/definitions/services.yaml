      env:
        - name: NAME
          example: my-stream
          required: true
          type: string
          hint: One provisioned shard, matching the 2024 marking scheme; encrypted, with 72-hour retention.
          pattern: '[A-Za-z0-9][A-Za-z0-9_.-]{0,63}'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: kinesis
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Stream:
            Type: AWS::Kinesis::Stream
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Name:
                Ref: Name
              StreamModeDetails:
                StreamMode: PROVISIONED
              ShardCount: 1
              RetentionPeriodHours: 72
              StreamEncryption:
                EncryptionType: KMS
                KeyId: alias/aws/kinesis
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          TLS:
            Type: AWS::Kinesis::ResourcePolicy
            Properties:
              ResourceArn:
                Fn::GetAtt:
                  - Stream
                  - Arn
              ResourcePolicy:
                Version: 2012-10-17
                Statement:
                  - Effect: Deny
                    Principal: '*'
                    Action: kinesis:*
                    Resource:
                      Fn::GetAtt:
                        - Stream
                        - Arn
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                        aws:PrincipalIsAWSService: 'false'
          KinesisPublishAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Put individual or batched records into this encrypted stream.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - kinesis:PutRecord
                      - kinesis:PutRecords
                      - kinesis:DescribeStreamSummary
                    Resource:
                      Fn::GetAtt:
                        - Stream
                        - Arn
          KinesisReadAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Read records using shard iterators from this stream.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - kinesis:GetRecords
                      - kinesis:GetShardIterator
                      - kinesis:DescribeStream
                      - kinesis:DescribeStreamSummary
                      - kinesis:ListShards
                    Resource:
                      Fn::GetAtt:
                        - Stream
                        - Arn
        Outputs:
          StreamArn:
            Value:
              Fn::GetAtt:
                - Stream
                - Arn
          KinesisPublishAccessArn:
            Description: 'Optional policy: Put individual or batched records into this encrypted stream. Attach to a role, user or group when needed.'
            Value:
              Ref: KinesisPublishAccess
          KinesisReadAccessArn:
            Description: 'Optional policy: Read records using shard iterators from this stream. Attach to a role, user or group when needed.'
            Value:
              Ref: KinesisReadAccess
    - id: service-security
      title: GuardDuty and IAM Access Analyzer
      env:
        - name: NAME
          example: account-access
          required: true
          type: string
          pattern: '[A-Za-z][A-Za-z0-9_-]{0,254}'
          hint: External-access analyzer name. Reuses an existing account external-access analyzer in REGION, even if named differently.
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: security
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Description: GuardDuty, KMS-encrypted S3 findings export and account external-access analyzer. Import existing resources before deploying with CloudFormation; AWS CLI reuses existing enablement and healthy exports.
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Detector:
            Type: AWS::GuardDuty::Detector
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Enable: true
              FindingPublishingFrequency: FIFTEEN_MINUTES
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Analyzer:
            Type: AWS::AccessAnalyzer::Analyzer
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              AnalyzerName:
                Ref: Name
              Type: ACCOUNT
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          FindingsKey:
            Type: AWS::KMS::Key
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: GuardDuty findings export
              EnableKeyRotation: true
              KeyPolicy:
                Version: 2012-10-17
                Statement:
                  - Sid: AccountAdministration
                    Effect: Allow
                    Principal:
                      AWS:
                        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
                    Action: kms:*
                    Resource: '*'
                  - Sid: GuardDutyExport
                    Effect: Allow
                    Principal:
                      Service:
                        - Fn::Sub: guardduty.${AWS::URLSuffix}
                        - Fn::Sub: guardduty.${AWS::Region}.${AWS::URLSuffix}
                    Action: kms:GenerateDataKey
                    Resource: '*'
                    Condition:
                      StringEquals:
                        aws:SourceAccount:
                          Ref: AWS::AccountId
                        aws:SourceArn:
                          Fn::Sub: arn:${AWS::Partition}:guardduty:${AWS::Region}:${AWS::AccountId}:detector/${Detector}
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          FindingsBucket:
            Type: AWS::S3::Bucket
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              BucketName:
                Fn::Sub: guardduty-findings-${AWS::AccountId}-${AWS::Region}
              PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                IgnorePublicAcls: true
                BlockPublicPolicy: true
                RestrictPublicBuckets: true
              OwnershipControls:
                Rules:
                  - ObjectOwnership: BucketOwnerEnforced
              VersioningConfiguration:
                Status: Enabled
              BucketEncryption:
                ServerSideEncryptionConfiguration:
                  - ServerSideEncryptionByDefault:
                      SSEAlgorithm: aws:kms
                      KMSMasterKeyID:
                        Fn::GetAtt: [FindingsKey, Arn]
              LifecycleConfiguration:
                Rules:
                  - Id: FindingsRetention
                    Status: Enabled
                    ExpirationInDays: 365
                    NoncurrentVersionExpiration:
                      NoncurrentDays: 30
                    AbortIncompleteMultipartUpload:
                      DaysAfterInitiation: 1
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          FindingsBucketPolicy:
            Type: AWS::S3::BucketPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Bucket:
                Ref: FindingsBucket
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Sid: GuardDutyBucketLocation
                    Effect: Allow
                    Principal:
                      Service:
                        - Fn::Sub: guardduty.${AWS::URLSuffix}
                        - Fn::Sub: guardduty.${AWS::Region}.${AWS::URLSuffix}
                    Action: s3:GetBucketLocation
                    Resource:
                      Fn::GetAtt: [FindingsBucket, Arn]
                    Condition:
                      StringEquals:
                        aws:SourceAccount:
                          Ref: AWS::AccountId
                        aws:SourceArn:
                          Fn::Sub: arn:${AWS::Partition}:guardduty:${AWS::Region}:${AWS::AccountId}:detector/${Detector}
                  - Sid: GuardDutyWrite
                    Effect: Allow
                    Principal:
                      Service:
                        - Fn::Sub: guardduty.${AWS::URLSuffix}
                        - Fn::Sub: guardduty.${AWS::Region}.${AWS::URLSuffix}
                    Action: s3:PutObject
                    Resource:
                      Fn::Sub: ${FindingsBucket.Arn}/*
                    Condition:
                      StringEquals:
                        aws:SourceAccount:
                          Ref: AWS::AccountId
                        aws:SourceArn:
                          Fn::Sub: arn:${AWS::Partition}:guardduty:${AWS::Region}:${AWS::AccountId}:detector/${Detector}
                  - Sid: RequireTLS
                    Effect: Deny
                    Principal: '*'
                    Action: s3:*
                    Resource:
                      - Fn::GetAtt: [FindingsBucket, Arn]
                      - Fn::Sub: ${FindingsBucket.Arn}/*
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                  - Sid: RequireKMS
                    Effect: Deny
                    Principal: '*'
                    Action: s3:PutObject
                    Resource:
                      Fn::Sub: ${FindingsBucket.Arn}/*
                    Condition:
                      StringNotEquals:
                        s3:x-amz-server-side-encryption: aws:kms
                  - Sid: RequireFindingsKey
                    Effect: Deny
                    Principal: '*'
                    Action: s3:PutObject
                    Resource:
                      Fn::Sub: ${FindingsBucket.Arn}/*
                    Condition:
                      StringNotEquals:
                        s3:x-amz-server-side-encryption-aws-kms-key-id:
                          Fn::GetAtt: [FindingsKey, Arn]
          GuardDutyFindingExport:
            Type: AWS::GuardDuty::PublishingDestination
            DependsOn: FindingsBucketPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              DetectorId:
                Ref: Detector
              DestinationType: S3
              DestinationProperties:
                DestinationArn:
                  Fn::GetAtt: [FindingsBucket, Arn]
                KmsKeyArn:
                  Fn::GetAtt: [FindingsKey, Arn]
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
        Outputs:
          DetectorId:
            Value:
              Ref: Detector
          AnalyzerArn:
            Value:
              Fn::GetAtt:
                - Analyzer
                - Arn
          FindingsBucket:
            Value:
              Ref: FindingsBucket
          FindingsKeyArn:
            Value:
              Fn::GetAtt: [FindingsKey, Arn]
      cli: security
    - id: service-iot-audit
      title: IoT Device Defender Audit
      env:
        - name: NAME
          example: my-iot-audit
          required: true
          hint: Enables all audit checks, a daily schedule, IoT logging and an encrypted SNS topic. Subscribe notifications later.
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: iot-audit
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Description: Daily Device Defender audit with every supported check, IoT logging and an encrypted SNS topic; no notification subscriber required. One audit/logging configuration per account and region; import existing resources before using CloudFormation.
        Parameters:
          Name:
            Type: String
            AllowedPattern: '[a-z][a-z0-9-]{2,23}'
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Alerts:
            Type: AWS::SNS::Topic
            Properties:
              TopicName:
                Fn::Sub: ${Name}-audit
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
              KmsMasterKeyId: alias/aws/sns
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
          AlertsTLS:
            Type: AWS::SNS::TopicPolicy
            Properties:
              Topics:
                - Ref: Alerts
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Deny
                    Principal: '*'
                    Action: sns:*
                    Resource:
                      Ref: Alerts
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                        aws:PrincipalIsAWSService: 'false'
          AuditRole:
            Type: AWS::IAM::Role
            Properties:
              AssumeRolePolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: iot.amazonaws.com
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        aws:SourceAccount:
                          Ref: AWS::AccountId
                      ArnLike:
                        aws:SourceArn:
                          Fn::Sub: 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:*'
              ManagedPolicyArns:
                - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSIoTDeviceDefenderAudit
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          NotificationRole:
            Type: AWS::IAM::Role
            Properties:
              AssumeRolePolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: iot.amazonaws.com
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        aws:SourceAccount:
                          Ref: AWS::AccountId
                      ArnLike:
                        aws:SourceArn:
                          Fn::Sub: 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:*'
              Policies:
                - PolicyName: ServiceAccess
                  PolicyDocument:
                    Version: 2012-10-17
                    Statement:
                      - Effect: Allow
                        Action: sns:Publish
                        Resource:
                          Ref: Alerts
                      - Effect: Allow
                        Action:
                          - kms:GenerateDataKey
                          - kms:Decrypt
                        Resource:
                          Fn::Sub: arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
                        Condition:
                          StringEquals:
                            kms:ViaService:
                              Fn::Sub: sns.${AWS::Region}.${AWS::URLSuffix}
                          ForAnyValue:StringEquals:
                            kms:ResourceAliases: alias/aws/sns
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Logs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName: AWSIotLogsV2
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          LoggingRole:
            Type: AWS::IAM::Role
            Properties:
              AssumeRolePolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: iot.amazonaws.com
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        aws:SourceAccount:
                          Ref: AWS::AccountId
                      ArnLike:
                        aws:SourceArn:
                          Fn::Sub: arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:*
              Policies:
                - PolicyName: ServiceAccess
                  PolicyDocument:
                    Version: 2012-10-17
                    Statement:
                      - Effect: Allow
                        Action:
                          - logs:CreateLogStream
                          - logs:PutLogEvents
                        Resource:
                          Fn::GetAtt:
                            - Logs
                            - Arn
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Logging:
            Type: AWS::IoT::Logging
            Properties:
              AccountId:
                Ref: AWS::AccountId
              DefaultLogLevel: INFO
              RoleArn:
                Fn::GetAtt:
                  - LoggingRole
                  - Arn
          Audit:
            Type: AWS::IoT::AccountAuditConfiguration
            Properties:
              AccountId:
                Ref: AWS::AccountId
              RoleArn:
                Fn::GetAtt:
                  - AuditRole
                  - Arn
              AuditCheckConfigurations:
                AuthenticatedCognitoRoleOverlyPermissiveCheck:
                  Enabled: true
                CaCertificateExpiringCheck:
                  Enabled: true
                CaCertificateKeyQualityCheck:
                  Enabled: true
                ConflictingClientIdsCheck:
                  Enabled: true
                DeviceCertificateAgeCheck:
                  Enabled: true
                DeviceCertificateExpiringCheck:
                  Enabled: true
                DeviceCertificateKeyQualityCheck:
                  Enabled: true
                DeviceCertificateSharedCheck:
                  Enabled: true
                IntermediateCaRevokedForActiveDeviceCertificatesCheck:
                  Enabled: true
                IoTPolicyPotentialMisConfigurationCheck:
                  Enabled: true
                IotPolicyOverlyPermissiveCheck:
                  Enabled: true
                IotRoleAliasAllowsAccessToUnusedServicesCheck:
                  Enabled: true
                IotRoleAliasOverlyPermissiveCheck:
                  Enabled: true
                LoggingDisabledCheck:
                  Enabled: true
                RevokedCaCertificateStillActiveCheck:
                  Enabled: true
                RevokedDeviceCertificateStillActiveCheck:
                  Enabled: true
                UnauthenticatedCognitoRoleOverlyPermissiveCheck:
                  Enabled: true
              AuditNotificationTargetConfigurations:
                Sns:
                  Enabled: true
                  TargetArn:
                    Ref: Alerts
                  RoleArn:
                    Fn::GetAtt:
                      - NotificationRole
                      - Arn
          DailyAudit:
            Type: AWS::IoT::ScheduledAudit
            DependsOn: Audit
            Properties:
              ScheduledAuditName:
                Ref: Name
              Frequency: DAILY
              TargetCheckNames:
                - AUTHENTICATED_COGNITO_ROLE_OVERLY_PERMISSIVE_CHECK
                - CA_CERTIFICATE_EXPIRING_CHECK
                - CA_CERTIFICATE_KEY_QUALITY_CHECK
                - CONFLICTING_CLIENT_IDS_CHECK
                - DEVICE_CERTIFICATE_AGE_CHECK
                - DEVICE_CERTIFICATE_EXPIRING_CHECK
                - DEVICE_CERTIFICATE_KEY_QUALITY_CHECK
                - DEVICE_CERTIFICATE_SHARED_CHECK
                - INTERMEDIATE_CA_REVOKED_FOR_ACTIVE_DEVICE_CERTIFICATES_CHECK
                - IOT_POLICY_POTENTIAL_MISCONFIGURATION_CHECK
                - IOT_POLICY_OVERLY_PERMISSIVE_CHECK
                - IOT_ROLE_ALIAS_ALLOWS_ACCESS_TO_UNUSED_SERVICES_CHECK
                - IOT_ROLE_ALIAS_OVERLY_PERMISSIVE_CHECK
                - LOGGING_DISABLED_CHECK
                - REVOKED_CA_CERTIFICATE_STILL_ACTIVE_CHECK
                - REVOKED_DEVICE_CERTIFICATE_STILL_ACTIVE_CHECK
                - UNAUTHENTICATED_COGNITO_ROLE_OVERLY_PERMISSIVE_CHECK
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
        Outputs:
          Notifications:
            Value:
              Ref: Alerts
            Description: Optional notification topic; add subscribers when needed.
    - id: service-transfer
      title: Transfer Family SFTP
      env:
        - name: NAME
          example: my-transfer
          required: true
          hint: Creates public SFTP, encrypted/versioned storage, logging and an uploads/ access role. Add SSH-key users later; a VPC can be configured after stopping the server.
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: transfer
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Description: Public SFTP baseline with encrypted/versioned S3 storage, structured logging and a role scoped to uploads/. Add service-managed SSH-key users with this role and a logical home at /bucket/uploads. No VPC required; stop the server before changing its endpoint type. Server has an hourly charge until deleted.
        Parameters:
          Name:
            Type: String
            AllowedPattern: '[a-z][a-z0-9-]{2,23}'
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Bucket:
            Type: AWS::S3::Bucket
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              BucketName:
                Fn::Sub: ${Name}-${AWS::AccountId}-${AWS::Region}
              BucketEncryption:
                ServerSideEncryptionConfiguration:
                  - ServerSideEncryptionByDefault:
                      SSEAlgorithm: AES256
              PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true
              OwnershipControls:
                Rules:
                  - ObjectOwnership: BucketOwnerEnforced
              VersioningConfiguration:
                Status: Enabled
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
              LifecycleConfiguration:
                Rules:
                  - Id: Cleanup
                    Status: Enabled
                    AbortIncompleteMultipartUpload:
                      DaysAfterInitiation: 1
                    NoncurrentVersionExpiration:
                      NoncurrentDays: 90
          TLS:
            Type: AWS::S3::BucketPolicy
            Properties:
              Bucket:
                Ref: Bucket
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Deny
                    Principal: '*'
                    Action: s3:*
                    Resource:
                      - Fn::GetAtt:
                          - Bucket
                          - Arn
                      - Fn::Sub: ${Bucket.Arn}/*
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                        aws:PrincipalIsAWSService: 'false'
          Logs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: /aws/transfer/${Name}
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Server:
            Type: AWS::Transfer::Server
            Properties:
              Domain: S3
              EndpointType: PUBLIC
              IdentityProviderType: SERVICE_MANAGED
              Protocols:
                - SFTP
              SecurityPolicyName: TransferSecurityPolicy-2024-01
              StructuredLogDestinations:
                - Fn::GetAtt:
                    - Logs
                    - Arn
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          UserRole:
            Type: AWS::IAM::Role
            Properties:
              AssumeRolePolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: transfer.amazonaws.com
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        aws:SourceAccount:
                          Ref: AWS::AccountId
                      ArnLike:
                        aws:SourceArn:
                          Fn::Sub: arn:${AWS::Partition}:transfer:${AWS::Region}:${AWS::AccountId}:user/${Server.ServerId}/*
              Policies:
                - PolicyName: ServiceAccess
                  PolicyDocument:
                    Version: 2012-10-17
                    Statement:
                      - Effect: Allow
                        Action: s3:ListBucket
                        Resource:
                          Fn::GetAtt:
                            - Bucket
                            - Arn
                        Condition:
                          StringLike:
                            s3:prefix:
                              - uploads
                              - uploads/*
                      - Effect: Allow
                        Action: s3:GetBucketLocation
                        Resource:
                          Fn::GetAtt:
                            - Bucket
                            - Arn
                      - Effect: Allow
                        Action:
                          - s3:GetObject
                          - s3:PutObject
                          - s3:DeleteObject
                          - s3:GetObjectVersion
                        Resource:
                          Fn::Sub: ${Bucket.Arn}/uploads/*
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          TransferReadAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Read the Transfer bucket uploads/ prefix.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - s3:GetBucketLocation
                    Resource:
                      Fn::GetAtt:
                        - Bucket
                        - Arn
                  - Effect: Allow
                    Action:
                      - s3:ListBucket
                      - s3:ListBucketVersions
                    Resource:
                      Fn::GetAtt:
                        - Bucket
                        - Arn
                    Condition:
                      StringLike:
                        s3:prefix:
                          - uploads
                          - uploads/*
                  - Effect: Allow
                    Action:
                      - s3:GetObject
                      - s3:GetObjectVersion
                    Resource:
                      Fn::Sub: ${Bucket.Arn}/uploads/*
          TransferWriteAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Upload objects under uploads/ and inspect multipart uploads in the Transfer bucket.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - s3:GetBucketLocation
                      - s3:ListBucketMultipartUploads
                    Resource:
                      Fn::GetAtt:
                        - Bucket
                        - Arn
                  - Effect: Allow
                    Action:
                      - s3:PutObject
                      - s3:AbortMultipartUpload
                      - s3:ListMultipartUploadParts
                    Resource:
                      Fn::Sub: ${Bucket.Arn}/uploads/*
        Outputs:
          ServerId:
            Value:
              Fn::GetAtt:
                - Server
                - ServerId
          BucketName:
            Value:
              Ref: Bucket
          UserRoleArn:
            Description: Use this role for service-managed SSH-key users.
            Value:
              Fn::GetAtt:
                - UserRole
                - Arn
          HomeDirectory:
            Description: Use as the target of a logical home mapping with Entry /.
            Value:
              Fn::Sub: /${Bucket}/uploads
          TransferReadAccessArn:
            Description: 'Optional policy: Read the Transfer bucket uploads/ prefix. Attach to a role, user or group when needed.'
            Value:
              Ref: TransferReadAccess
          TransferWriteAccessArn:
            Description: 'Optional policy: Upload objects under uploads/ and inspect multipart uploads in the Transfer bucket. Attach to a role, user or group when needed.'
            Value:
              Ref: TransferWriteAccess
