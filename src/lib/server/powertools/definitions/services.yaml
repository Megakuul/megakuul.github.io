- id: services
  title: Services
  recipes:
    - id: service-lambda
      title: Lambda
      env:
        - name: NAME
          example: my-function
          required: true
          type: string
          hint: Bootstrap function; deploy your handler. Enable logging and X-Ray permissions on the execution role; configure an async failure destination for the workload.
          pattern: '[A-Za-z0-9][A-Za-z0-9_.-]{0,63}'
        - name: ROLE_NAME
          example: my-app-role
          required: true
          type: string
          hint: Existing execution role; paste the required service permissions into its bound policy.
          pattern: '[A-Za-z0-9+=,.@_-]{1,64}'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: lambda
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          RoleArn:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Logs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: /aws/lambda/${Name}
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Function:
            Type: AWS::Lambda::Function
            Properties:
              FunctionName:
                Ref: Name
              Runtime: nodejs24.x
              Handler: index.handler
              Role:
                Ref: RoleArn
              Code:
                ZipFile: exports.handler=async()=>{throw new Error("Deploy application code before invoking this function.");};
              MemorySize: 256
              Timeout: 10
              TracingConfig:
                Mode: Active
              Architectures:
                - arm64
              LoggingConfig:
                LogFormat: JSON
                ApplicationLogLevel: INFO
                SystemLogLevel: WARN
                LogGroup:
                  Ref: Logs
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Retries:
            Type: AWS::Lambda::EventInvokeConfig
            Properties:
              FunctionName:
                Ref: Function
              Qualifier: $LATEST
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600
          LambdaInvokeAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Invoke this function, its versions and aliases.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action: lambda:InvokeFunction
                    Resource:
                      - Fn::GetAtt:
                          - Function
                          - Arn
                      - Fn::Sub: ${Function.Arn}:*
        Outputs:
          FunctionArn:
            Value:
              Fn::GetAtt:
                - Function
                - Arn
          LambdaInvokeAccessArn:
            Description: 'Optional policy: Invoke this function, its versions and aliases. Attach to a role, user or group when needed.'
            Value:
              Ref: LambdaInvokeAccess
    - id: service-http-api
      title: HTTP API
      env:
        - name: NAME
          example: my-http-api
          required: true
          type: string
          pattern: '[a-z][a-z0-9-]{2,31}'
          hint: 'Deployed live stage + Lambda: GET / and POST /items. IAM/SigV4 required; attach the output invoke policy to callers. Access/Lambda logs, detailed metrics, throttling and alarms. HTTP APIs have no execution logs, API X-Ray or WAF; Lambda tracing is enabled.'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: http-api
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Description: 'Deployed live stage + Lambda: GET / and POST /items. IAM/SigV4 required; attach the output invoke policy to callers. Access/Lambda logs, detailed metrics, throttling and alarms. HTTP APIs have no execution logs, API X-Ray or WAF; Lambda tracing is enabled.'
        Parameters:
          Name:
            Type: String
            AllowedPattern: '[a-z][a-z0-9-]{2,31}'
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          AccessLogs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: /aws/apigateway/${Name}/http-api/access
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          BackendLogs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: /aws/lambda/${Name}-http-api
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          BackendRole:
            Type: AWS::IAM::Role
            Properties:
              AssumeRolePolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: lambda.amazonaws.com
                    Action: sts:AssumeRole
              Policies:
                - PolicyName: LogsAndTracing
                  PolicyDocument:
                    Version: 2012-10-17
                    Statement:
                      - Effect: Allow
                        Action:
                          - logs:CreateLogStream
                          - logs:PutLogEvents
                        Resource:
                          Fn::GetAtt:
                            - BackendLogs
                            - Arn
                      - Effect: Allow
                        Action:
                          - xray:PutTraceSegments
                          - xray:PutTelemetryRecords
                        Resource: '*'
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Backend:
            Type: AWS::Lambda::Function
            Properties:
              FunctionName:
                Fn::Sub: ${Name}-http-api
              Runtime: nodejs24.x
              Handler: index.handler
              Role:
                Fn::GetAtt:
                  - BackendRole
                  - Arn
              Code:
                ZipFile: |-
                  exports.handler = async (event, context) => {
                    const method = event.requestContext?.http?.method ?? event.httpMethod;
                    const path = event.resource ?? event.routeKey?.split(" ")[1] ?? event.rawPath ?? event.path;
                    const reply = (statusCode, body) => {
                      console.info({ requestId: context.awsRequestId, method, statusCode });
                      return { statusCode, headers: {
                        "content-type": "application/json", "cache-control": "no-store",
                        "x-content-type-options": "nosniff", "strict-transport-security": "max-age=31536000"
                      }, body: JSON.stringify(body) };
                    };
                    if (method === "GET" && path === "/") return reply(200, { status: "ok" });
                    if (method !== "POST" || path !== "/items") return reply(404, { message: "Not found" });
                    const type = Object.entries(event.headers ?? {}).find(([key]) => key.toLowerCase() === "content-type")?.[1];
                    if (!type || type.split(";")[0].trim().toLowerCase() !== "application/json")
                      return reply(415, { message: "Use application/json" });
                    const raw = event.isBase64Encoded ? Buffer.from(event.body ?? "", "base64").toString("utf8") : event.body ?? "";
                    if (Buffer.byteLength(raw) > 4096) return reply(413, { message: "Body too large" });
                    let body;
                    try { body = JSON.parse(raw); } catch { return reply(400, { message: "Invalid JSON" }); }
                    if (!body || Array.isArray(body) || typeof body.message !== "string" ||
                        body.message.length < 1 || body.message.length > 1000 || Object.keys(body).length !== 1)
                      return reply(400, { message: "Expected message (1-1000 characters)" });
                    return reply(200, { accepted: true });
                  };
              MemorySize: 256
              Timeout: 10
              Architectures:
                - arm64
              TracingConfig:
                Mode: Active
              LoggingConfig:
                LogFormat: JSON
                ApplicationLogLevel: INFO
                SystemLogLevel: INFO
                LogGroup:
                  Ref: BackendLogs
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Api:
            Type: AWS::ApiGatewayV2::Api
            Properties:
              Name:
                Ref: Name
              ProtocolType: HTTP
              DisableExecuteApiEndpoint: false
          Integration:
            Type: AWS::ApiGatewayV2::Integration
            Properties:
              ApiId:
                Ref: Api
              IntegrationType: AWS_PROXY
              IntegrationMethod: POST
              IntegrationUri:
                Fn::GetAtt:
                  - Backend
                  - Arn
              PayloadFormatVersion: '2.0'
              TimeoutInMillis: 12000
          InvokeGet:
            Type: AWS::Lambda::Permission
            Properties:
              FunctionName:
                Ref: Backend
              Action: lambda:InvokeFunction
              Principal: apigateway.amazonaws.com
              SourceAccount:
                Ref: AWS::AccountId
              SourceArn:
                Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/live/GET/
          InvokePost:
            Type: AWS::Lambda::Permission
            Properties:
              FunctionName:
                Ref: Backend
              Action: lambda:InvokeFunction
              Principal: apigateway.amazonaws.com
              SourceAccount:
                Ref: AWS::AccountId
              SourceArn:
                Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/live/POST/items
          GetRoute:
            Type: AWS::ApiGatewayV2::Route
            Properties:
              ApiId:
                Ref: Api
              RouteKey: GET /
              AuthorizationType: AWS_IAM
              Target:
                Fn::Sub: integrations/${Integration}
          PostRoute:
            Type: AWS::ApiGatewayV2::Route
            Properties:
              ApiId:
                Ref: Api
              RouteKey: POST /items
              AuthorizationType: AWS_IAM
              Target:
                Fn::Sub: integrations/${Integration}
          Stage:
            Type: AWS::ApiGatewayV2::Stage
            DependsOn:
              - GetRoute
              - PostRoute
              - InvokeGet
              - InvokePost
            Properties:
              ApiId:
                Ref: Api
              StageName: live
              AutoDeploy: true
              AccessLogSettings:
                DestinationArn:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${AccessLogs}
                Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","responseLatency":"$context.responseLatency","integrationStatus":"$context.integrationStatus","integrationLatency":"$context.integrationLatency"}'
              DefaultRouteSettings:
                DetailedMetricsEnabled: true
                ThrottlingBurstLimit: 20
                ThrottlingRateLimit: 10
          InvokePolicy:
            Type: AWS::IAM::ManagedPolicy
            Properties:
              Description: Attach to callers; sign requests with AWS SigV4.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action: execute-api:Invoke
                    Resource:
                      - Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/live/GET/
                      - Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/live/POST/items
          ServerErrors:
            Type: AWS::CloudWatch::Alarm
            Properties:
              AlarmDescription: ServerErrors on the live API stage
              Namespace: AWS/ApiGateway
              MetricName: 5xx
              Dimensions:
                - Name: ApiId
                  Value:
                    Ref: Api
                - Name: Stage
                  Value: live
              Statistic: Sum
              Period: 60
              EvaluationPeriods: 2
              DatapointsToAlarm: 2
              Threshold: 0
              ComparisonOperator: GreaterThanThreshold
              TreatMissingData: notBreaching
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          ClientErrors:
            Type: AWS::CloudWatch::Alarm
            Properties:
              AlarmDescription: ClientErrors on the live API stage
              Namespace: AWS/ApiGateway
              MetricName: 4xx
              Dimensions:
                - Name: ApiId
                  Value:
                    Ref: Api
                - Name: Stage
                  Value: live
              Statistic: Sum
              Period: 60
              EvaluationPeriods: 2
              DatapointsToAlarm: 2
              Threshold: 20
              ComparisonOperator: GreaterThanThreshold
              TreatMissingData: notBreaching
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Latency:
            Type: AWS::CloudWatch::Alarm
            Properties:
              AlarmDescription: Latency on the live API stage
              Namespace: AWS/ApiGateway
              MetricName: Latency
              Dimensions:
                - Name: ApiId
                  Value:
                    Ref: Api
                - Name: Stage
                  Value: live
              ExtendedStatistic: p95
              Period: 60
              EvaluationPeriods: 2
              DatapointsToAlarm: 2
              Threshold: 2000
              ComparisonOperator: GreaterThanThreshold
              TreatMissingData: notBreaching
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          BackendErrors:
            Type: AWS::CloudWatch::Alarm
            Properties:
              AlarmDescription: Lambda errors or throttles
              Metrics:
                - Id: failures
                  Expression: errors + throttles
                  Label: Errors and throttles
                  ReturnData: true
                - Id: errors
                  MetricStat:
                    Metric:
                      Namespace: AWS/Lambda
                      MetricName: Errors
                      Dimensions:
                        - Name: FunctionName
                          Value:
                            Ref: Backend
                    Period: 60
                    Stat: Sum
                  ReturnData: false
                - Id: throttles
                  MetricStat:
                    Metric:
                      Namespace: AWS/Lambda
                      MetricName: Throttles
                      Dimensions:
                        - Name: FunctionName
                          Value:
                            Ref: Backend
                    Period: 60
                    Stat: Sum
                  ReturnData: false
              EvaluationPeriods: 1
              Threshold: 0
              ComparisonOperator: GreaterThanThreshold
              TreatMissingData: notBreaching
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
        Outputs:
          ApiUrl:
            Description: IAM/SigV4 GET /; POST /items with application/json body {"message":"hello"}.
            Value:
              Fn::Sub: https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/live/
          InvokePolicyArn:
            Description: Attach to the IAM caller. API keys are not authentication.
            Value:
              Ref: InvokePolicy
          BackendName:
            Value:
              Ref: Backend
          AccessLogGroup:
            Value:
              Ref: AccessLogs
    - id: service-rest-api
      title: REST API
      env:
        - name: NAME
          example: my-rest-api
          required: true
          type: string
          pattern: '[a-z][a-z0-9-]{2,31}'
          hint: 'Deployed live stage + Lambda: GET / and POST /items. IAM/SigV4 required; attach the output invoke policy. Access/execution/Lambda/WAF logs, X-Ray, validation, throttling and alarms. Payload tracing and WAF request sampling stay off to protect secrets. Configures the regional REST logging role; manage that account setting in only one stack per region.'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: rest-api
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Description: 'Deployed live stage + Lambda: GET / and POST /items. IAM/SigV4 required; attach the output invoke policy. Access/execution/Lambda/WAF logs, X-Ray, validation, throttling and alarms. Payload tracing and WAF request sampling stay off to protect secrets. Configures the regional REST logging role; manage that account setting in only one stack per region.'
        Parameters:
          Name:
            Type: String
            AllowedPattern: '[a-z][a-z0-9-]{2,31}'
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          AccessLogs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: /aws/apigateway/${Name}/rest-api/access
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          BackendLogs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: /aws/lambda/${Name}-rest-api
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          BackendRole:
            Type: AWS::IAM::Role
            Properties:
              AssumeRolePolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: lambda.amazonaws.com
                    Action: sts:AssumeRole
              Policies:
                - PolicyName: LogsAndTracing
                  PolicyDocument:
                    Version: 2012-10-17
                    Statement:
                      - Effect: Allow
                        Action:
                          - logs:CreateLogStream
                          - logs:PutLogEvents
                        Resource:
                          Fn::GetAtt:
                            - BackendLogs
                            - Arn
                      - Effect: Allow
                        Action:
                          - xray:PutTraceSegments
                          - xray:PutTelemetryRecords
                        Resource: '*'
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Backend:
            Type: AWS::Lambda::Function
            Properties:
              FunctionName:
                Fn::Sub: ${Name}-rest-api
              Runtime: nodejs24.x
              Handler: index.handler
              Role:
                Fn::GetAtt:
                  - BackendRole
                  - Arn
              Code:
                ZipFile: |-
                  exports.handler = async (event, context) => {
                    const method = event.requestContext?.http?.method ?? event.httpMethod;
                    const path = event.resource ?? event.routeKey?.split(" ")[1] ?? event.rawPath ?? event.path;
                    const reply = (statusCode, body) => {
                      console.info({ requestId: context.awsRequestId, method, statusCode });
                      return { statusCode, headers: {
                        "content-type": "application/json", "cache-control": "no-store",
                        "x-content-type-options": "nosniff", "strict-transport-security": "max-age=31536000"
                      }, body: JSON.stringify(body) };
                    };
                    if (method === "GET" && path === "/") return reply(200, { status: "ok" });
                    if (method !== "POST" || path !== "/items") return reply(404, { message: "Not found" });
                    const type = Object.entries(event.headers ?? {}).find(([key]) => key.toLowerCase() === "content-type")?.[1];
                    if (!type || type.split(";")[0].trim().toLowerCase() !== "application/json")
                      return reply(415, { message: "Use application/json" });
                    const raw = event.isBase64Encoded ? Buffer.from(event.body ?? "", "base64").toString("utf8") : event.body ?? "";
                    if (Buffer.byteLength(raw) > 4096) return reply(413, { message: "Body too large" });
                    let body;
                    try { body = JSON.parse(raw); } catch { return reply(400, { message: "Invalid JSON" }); }
                    if (!body || Array.isArray(body) || typeof body.message !== "string" ||
                        body.message.length < 1 || body.message.length > 1000 || Object.keys(body).length !== 1)
                      return reply(400, { message: "Expected message (1-1000 characters)" });
                    return reply(200, { accepted: true });
                  };
              MemorySize: 256
              Timeout: 10
              Architectures:
                - arm64
              TracingConfig:
                Mode: Active
              LoggingConfig:
                LogFormat: JSON
                ApplicationLogLevel: INFO
                SystemLogLevel: INFO
                LogGroup:
                  Ref: BackendLogs
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Api:
            Type: AWS::ApiGateway::RestApi
            Properties:
              Name:
                Ref: Name
              EndpointConfiguration:
                Types:
                  - REGIONAL
              SecurityPolicy: SecurityPolicy_TLS13_1_2_PFS_PQ_2025_09
              EndpointAccessMode: STRICT
              DisableExecuteApiEndpoint: false
              FailOnWarnings: true
              Mode: overwrite
              Body:
                swagger: '2.0'
                info:
                  title:
                    Ref: Name
                  version: '1.0'
                schemes:
                  - https
                produces:
                  - application/json
                securityDefinitions:
                  sigv4:
                    type: apiKey
                    name: Authorization
                    in: header
                    x-amazon-apigateway-authtype: awsSigv4
                security:
                  - sigv4: []
                x-amazon-apigateway-request-validators:
                  Validate:
                    validateRequestBody: true
                    validateRequestParameters: true
                x-amazon-apigateway-request-validator: Validate
                definitions:
                  Message:
                    type: object
                    required:
                      - message
                    additionalProperties: false
                    properties:
                      message:
                        type: string
                        minLength: 1
                        maxLength: 1000
                paths:
                  /:
                    get:
                      responses:
                        '200':
                          description: OK
                      x-amazon-apigateway-integration:
                        type: aws_proxy
                        httpMethod: POST
                        uri:
                          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Backend.Arn}/invocations
                        timeoutInMillis: 12000
                  /items:
                    post:
                      consumes:
                        - application/json
                      parameters:
                        - name: body
                          in: body
                          required: true
                          schema:
                            $ref: '#/definitions/Message'
                      responses:
                        '200':
                          description: Accepted
                        '400':
                          description: Invalid request
                      x-amazon-apigateway-integration:
                        type: aws_proxy
                        httpMethod: POST
                        uri:
                          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Backend.Arn}/invocations
                        timeoutInMillis: 12000
                x-amazon-apigateway-security-policy: SecurityPolicy_TLS13_1_2_PFS_PQ_2025_09
                x-amazon-apigateway-endpoint-access-mode: STRICT
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          InvokeGet:
            Type: AWS::Lambda::Permission
            Properties:
              FunctionName:
                Ref: Backend
              Action: lambda:InvokeFunction
              Principal: apigateway.amazonaws.com
              SourceAccount:
                Ref: AWS::AccountId
              SourceArn:
                Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/live/GET/
          InvokePost:
            Type: AWS::Lambda::Permission
            Properties:
              FunctionName:
                Ref: Backend
              Action: lambda:InvokeFunction
              Principal: apigateway.amazonaws.com
              SourceAccount:
                Ref: AWS::AccountId
              SourceArn:
                Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/live/POST/items
          ExecutionLogs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: API-Gateway-Execution-Logs_${Api}/live
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          LoggingRole:
            Type: AWS::IAM::Role
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Regional API Gateway logging role; retained because the account setting outlives stacks.
              AssumeRolePolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: apigateway.amazonaws.com
                    Action: sts:AssumeRole
              Policies:
                - PolicyName: RegionalApiLogs
                  PolicyDocument:
                    Version: 2012-10-17
                    Statement:
                      - Effect: Allow
                        Action: logs:DescribeLogGroups
                        Resource: '*'
                      - Effect: Allow
                        Action:
                          - logs:CreateLogGroup
                          - logs:CreateLogStream
                          - logs:DescribeLogStreams
                          - logs:PutLogEvents
                          - logs:GetLogEvents
                          - logs:FilterLogEvents
                        Resource:
                          Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          LoggingAccount:
            Type: AWS::ApiGateway::Account
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              CloudWatchRoleArn:
                Fn::GetAtt:
                  - LoggingRole
                  - Arn
          DeploymentV1:
            Type: AWS::ApiGateway::Deployment
            DependsOn:
              - InvokeGet
              - InvokePost
            Properties:
              RestApiId:
                Ref: Api
              Description: Initial routes. Change this resource logical ID when updating the OpenAPI definition.
          Stage:
            Type: AWS::ApiGateway::Stage
            DependsOn:
              - LoggingAccount
              - ExecutionLogs
            Properties:
              RestApiId:
                Ref: Api
              StageName: live
              DeploymentId:
                Ref: DeploymentV1
              TracingEnabled: true
              CacheClusterEnabled: false
              AccessLogSetting:
                DestinationArn:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${AccessLogs}
                Format: '{"requestId":"$context.requestId","extendedRequestId":"$context.extendedRequestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","responseLatency":"$context.responseLatency","integrationStatus":"$context.integration.status","integrationLatency":"$context.integration.latency","wafResponseCode":"$context.wafResponseCode","xrayTraceId":"$context.xrayTraceId","tlsVersion":"$context.tlsVersion","cipherSuite":"$context.cipherSuite"}'
              MethodSettings:
                - HttpMethod: '*'
                  ResourcePath: /*
                  LoggingLevel: INFO
                  DataTraceEnabled: false
                  MetricsEnabled: true
                  ThrottlingBurstLimit: 20
                  ThrottlingRateLimit: 10
                  CachingEnabled: false
                  CacheDataEncrypted: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          WebACL:
            Type: AWS::WAFv2::WebACL
            Properties:
              Name:
                Fn::Sub: ${Name}-rest-api
              Scope: REGIONAL
              DefaultAction:
                Allow: {}
              VisibilityConfig:
                CloudWatchMetricsEnabled: true
                SampledRequestsEnabled: false
                MetricName: AllRequests
              Rules:
                - Name: AWSManagedRulesAmazonIpReputationList
                  Priority: 0
                  Statement:
                    ManagedRuleGroupStatement:
                      VendorName: AWS
                      Name: AWSManagedRulesAmazonIpReputationList
                  OverrideAction:
                    None: {}
                  VisibilityConfig:
                    CloudWatchMetricsEnabled: true
                    SampledRequestsEnabled: false
                    MetricName: AWSManagedRulesAmazonIpReputationList
                - Name: AWSManagedRulesCommonRuleSet
                  Priority: 1
                  Statement:
                    ManagedRuleGroupStatement:
                      VendorName: AWS
                      Name: AWSManagedRulesCommonRuleSet
                  OverrideAction:
                    None: {}
                  VisibilityConfig:
                    CloudWatchMetricsEnabled: true
                    SampledRequestsEnabled: false
                    MetricName: AWSManagedRulesCommonRuleSet
                - Name: AWSManagedRulesKnownBadInputsRuleSet
                  Priority: 2
                  Statement:
                    ManagedRuleGroupStatement:
                      VendorName: AWS
                      Name: AWSManagedRulesKnownBadInputsRuleSet
                  OverrideAction:
                    None: {}
                  VisibilityConfig:
                    CloudWatchMetricsEnabled: true
                    SampledRequestsEnabled: false
                    MetricName: AWSManagedRulesKnownBadInputsRuleSet
                - Name: AWSManagedRulesSQLiRuleSet
                  Priority: 3
                  Statement:
                    ManagedRuleGroupStatement:
                      VendorName: AWS
                      Name: AWSManagedRulesSQLiRuleSet
                  OverrideAction:
                    None: {}
                  VisibilityConfig:
                    CloudWatchMetricsEnabled: true
                    SampledRequestsEnabled: false
                    MetricName: AWSManagedRulesSQLiRuleSet
                - Name: RateLimit
                  Priority: 10
                  Action:
                    Block: {}
                  Statement:
                    RateBasedStatement:
                      Limit: 1000
                      EvaluationWindowSec: 300
                      AggregateKeyType: IP
                  VisibilityConfig:
                    CloudWatchMetricsEnabled: true
                    SampledRequestsEnabled: false
                    MetricName: RateLimit
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          WafLogs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: aws-waf-logs-${Name}-rest-api
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          WafLogging:
            Type: AWS::WAFv2::LoggingConfiguration
            Properties:
              ResourceArn:
                Fn::GetAtt:
                  - WebACL
                  - Arn
              LogDestinationConfigs:
                - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WafLogs}
              RedactedFields:
                - SingleHeader:
                    Name: authorization
                - SingleHeader:
                    Name: cookie
                - SingleHeader:
                    Name: x-api-key
                - SingleHeader:
                    Name: x-amz-security-token
                - QueryString: {}
          WafAssociation:
            Type: AWS::WAFv2::WebACLAssociation
            DependsOn:
              - Stage
              - WafLogging
            Properties:
              WebACLArn:
                Fn::GetAtt:
                  - WebACL
                  - Arn
              ResourceArn:
                Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${Api}/stages/live
          InvokePolicy:
            Type: AWS::IAM::ManagedPolicy
            Properties:
              Description: Attach to callers; sign requests with AWS SigV4.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action: execute-api:Invoke
                    Resource:
                      - Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/live/GET/
                      - Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/live/POST/items
          ServerErrors:
            Type: AWS::CloudWatch::Alarm
            Properties:
              AlarmDescription: ServerErrors on the live API stage
              Namespace: AWS/ApiGateway
              MetricName: 5XXError
              Dimensions:
                - Name: ApiName
                  Value:
                    Ref: Name
                - Name: Stage
                  Value: live
              Statistic: Sum
              Period: 60
              EvaluationPeriods: 2
              DatapointsToAlarm: 2
              Threshold: 0
              ComparisonOperator: GreaterThanThreshold
              TreatMissingData: notBreaching
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          ClientErrors:
            Type: AWS::CloudWatch::Alarm
            Properties:
              AlarmDescription: ClientErrors on the live API stage
              Namespace: AWS/ApiGateway
              MetricName: 4XXError
              Dimensions:
                - Name: ApiName
                  Value:
                    Ref: Name
                - Name: Stage
                  Value: live
              Statistic: Sum
              Period: 60
              EvaluationPeriods: 2
              DatapointsToAlarm: 2
              Threshold: 20
              ComparisonOperator: GreaterThanThreshold
              TreatMissingData: notBreaching
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Latency:
            Type: AWS::CloudWatch::Alarm
            Properties:
              AlarmDescription: Latency on the live API stage
              Namespace: AWS/ApiGateway
              MetricName: Latency
              Dimensions:
                - Name: ApiName
                  Value:
                    Ref: Name
                - Name: Stage
                  Value: live
              ExtendedStatistic: p95
              Period: 60
              EvaluationPeriods: 2
              DatapointsToAlarm: 2
              Threshold: 2000
              ComparisonOperator: GreaterThanThreshold
              TreatMissingData: notBreaching
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          BackendErrors:
            Type: AWS::CloudWatch::Alarm
            Properties:
              AlarmDescription: Lambda errors or throttles
              Metrics:
                - Id: failures
                  Expression: errors + throttles
                  Label: Errors and throttles
                  ReturnData: true
                - Id: errors
                  MetricStat:
                    Metric:
                      Namespace: AWS/Lambda
                      MetricName: Errors
                      Dimensions:
                        - Name: FunctionName
                          Value:
                            Ref: Backend
                    Period: 60
                    Stat: Sum
                  ReturnData: false
                - Id: throttles
                  MetricStat:
                    Metric:
                      Namespace: AWS/Lambda
                      MetricName: Throttles
                      Dimensions:
                        - Name: FunctionName
                          Value:
                            Ref: Backend
                    Period: 60
                    Stat: Sum
                  ReturnData: false
              EvaluationPeriods: 1
              Threshold: 0
              ComparisonOperator: GreaterThanThreshold
              TreatMissingData: notBreaching
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
        Outputs:
          ApiUrl:
            Description: IAM/SigV4 GET /; POST /items with application/json body {"message":"hello"}.
            Value:
              Fn::Sub: https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/live/
          InvokePolicyArn:
            Description: Attach to the IAM caller. API keys are not authentication.
            Value:
              Ref: InvokePolicy
          BackendName:
            Value:
              Ref: Backend
          AccessLogGroup:
            Value:
              Ref: AccessLogs
    - id: service-s3
      title: S3
      env:
        - name: NAME
          example: my-app-bucket-111122223333
          required: true
          type: string
          hint: ''
          pattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: s3
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          AccessLogs:
            Type: AWS::S3::Bucket
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              OwnershipControls:
                Rules:
                  - ObjectOwnership: BucketOwnerEnforced
              PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                IgnorePublicAcls: true
                BlockPublicPolicy: true
                RestrictPublicBuckets: true
              BucketEncryption:
                ServerSideEncryptionConfiguration:
                  - ServerSideEncryptionByDefault:
                      SSEAlgorithm: AES256
              VersioningConfiguration:
                Status: Enabled
              LifecycleConfiguration:
                Rules:
                  - Id: AbortIncompleteUploads
                    Status: Enabled
                    AbortIncompleteMultipartUpload:
                      DaysAfterInitiation: 7
                  - Id: OldVersions
                    Prefix: ''
                    Status: Enabled
                    NoncurrentVersionExpiration:
                      NoncurrentDays: 90
                      NewerNoncurrentVersions: 5
                  - Id: ExpireLogs
                    Status: Enabled
                    ExpirationInDays: 90
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          LogPolicy:
            Type: AWS::S3::BucketPolicy
            Properties:
              Bucket:
                Ref: AccessLogs
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Deny
                    Principal: '*'
                    Action: s3:*
                    Resource:
                      - Fn::GetAtt:
                          - AccessLogs
                          - Arn
                      - Fn::Sub: ${AccessLogs.Arn}/*
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                        aws:PrincipalIsAWSService: 'false'
                  - Effect: Allow
                    Principal:
                      Service: logging.s3.amazonaws.com
                    Action: s3:PutObject
                    Resource:
                      Fn::Sub: ${AccessLogs.Arn}/access/*
                    Condition:
                      StringEquals:
                        aws:SourceAccount:
                          Ref: AWS::AccountId
                      ArnLike:
                        aws:SourceArn:
                          Fn::Sub: arn:${AWS::Partition}:s3:::${Name}
          Bucket:
            Type: AWS::S3::Bucket
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              BucketName:
                Ref: Name
              OwnershipControls:
                Rules:
                  - ObjectOwnership: BucketOwnerEnforced
              PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                IgnorePublicAcls: true
                BlockPublicPolicy: true
                RestrictPublicBuckets: true
              BucketEncryption:
                ServerSideEncryptionConfiguration:
                  - ServerSideEncryptionByDefault:
                      SSEAlgorithm: AES256
              VersioningConfiguration:
                Status: Enabled
              LifecycleConfiguration:
                Rules:
                  - Id: AbortIncompleteUploads
                    Status: Enabled
                    AbortIncompleteMultipartUpload:
                      DaysAfterInitiation: 7
                  - Id: OldVersions
                    Prefix: ''
                    Status: Enabled
                    NoncurrentVersionExpiration:
                      NoncurrentDays: 90
                      NewerNoncurrentVersions: 5
              LoggingConfiguration:
                DestinationBucketName:
                  Ref: AccessLogs
                LogFilePrefix: access/
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
            DependsOn: LogPolicy
          Policy:
            Type: AWS::S3::BucketPolicy
            Properties:
              Bucket:
                Ref: Bucket
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Deny
                    Principal: '*'
                    Action: s3:*
                    Resource:
                      - Fn::GetAtt:
                          - Bucket
                          - Arn
                      - Fn::Sub: ${Bucket.Arn}/*
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                        aws:PrincipalIsAWSService: 'false'
                  - Effect: Deny
                    Principal: '*'
                    Action: s3:PutObject
                    Resource:
                      Fn::Sub: ${Bucket.Arn}/*
                    Condition:
                      'Null':
                        s3:x-amz-server-side-encryption-customer-algorithm: 'false'
          S3ReadAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Read and list objects and versions in this bucket.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - s3:GetBucketLocation
                    Resource:
                      Fn::GetAtt:
                        - Bucket
                        - Arn
                  - Effect: Allow
                    Action:
                      - s3:ListBucket
                      - s3:ListBucketVersions
                    Resource:
                      Fn::GetAtt:
                        - Bucket
                        - Arn
                  - Effect: Allow
                    Action:
                      - s3:GetObject
                      - s3:GetObjectVersion
                    Resource:
                      Fn::Sub: ${Bucket.Arn}/*
          S3WriteAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Upload objects and manage multipart uploads in this bucket.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - s3:GetBucketLocation
                      - s3:ListBucketMultipartUploads
                    Resource:
                      Fn::GetAtt:
                        - Bucket
                        - Arn
                  - Effect: Allow
                    Action:
                      - s3:PutObject
                      - s3:AbortMultipartUpload
                      - s3:ListMultipartUploadParts
                    Resource:
                      Fn::Sub: ${Bucket.Arn}/*
          S3DeleteAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Delete objects and specific versions in this bucket.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - s3:DeleteObject
                      - s3:DeleteObjectVersion
                    Resource:
                      Fn::Sub: ${Bucket.Arn}/*
        Outputs:
          Bucket:
            Value:
              Ref: Bucket
          S3ReadAccessArn:
            Description: 'Optional policy: Read and list objects and versions in this bucket. Attach to a role, user or group when needed.'
            Value:
              Ref: S3ReadAccess
          S3WriteAccessArn:
            Description: 'Optional policy: Upload objects and manage multipart uploads in this bucket. Attach to a role, user or group when needed.'
            Value:
              Ref: S3WriteAccess
          S3DeleteAccessArn:
            Description: 'Optional policy: Delete objects and specific versions in this bucket. Attach to a role, user or group when needed.'
            Value:
              Ref: S3DeleteAccess
    - id: service-sqs
      title: SQS
      env:
        - name: NAME
          example: my-queue
          required: true
          type: string
          hint: Add .fifo to NAME for a FIFO queue; a matching DLQ is created automatically.
          pattern: "[A-Za-z0-9_-]{1,70}(?:\\.fifo)?"
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: sqs
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
            AllowedPattern: '[A-Za-z0-9_-]{1,70}(?:\.fifo)?'
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Conditions:
          IsFifo:
            Fn::Equals:
              - Fn::Select:
                  - 1
                  - Fn::Split:
                      - '.'
                      - Fn::Sub: ${Name}.standard
              - fifo
        Resources:
          DLQ:
            Type: AWS::SQS::Queue
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              QueueName:
                Fn::If:
                  - IsFifo
                  - Fn::Join:
                      - ''
                      - - Fn::Select: [0, { Fn::Split: ['.', { Ref: Name }] }]
                        - '-dlq.fifo'
                  - Fn::Sub: ${Name}-dlq
              FifoQueue:
                Fn::If: [IsFifo, true, { Ref: 'AWS::NoValue' }]
              ContentBasedDeduplication:
                Fn::If: [IsFifo, true, { Ref: 'AWS::NoValue' }]
              SqsManagedSseEnabled: true
              MessageRetentionPeriod: 1209600
              ReceiveMessageWaitTimeSeconds: 20
              VisibilityTimeout: 180
              RedriveAllowPolicy:
                redrivePermission: byQueue
                sourceQueueArns:
                  - Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${Name}
              Tags:
                - Key: MonitoringRole
                  Value: dlq
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Queue:
            Type: AWS::SQS::Queue
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              QueueName:
                Ref: Name
              FifoQueue:
                Fn::If: [IsFifo, true, { Ref: 'AWS::NoValue' }]
              ContentBasedDeduplication:
                Fn::If: [IsFifo, true, { Ref: 'AWS::NoValue' }]
              SqsManagedSseEnabled: true
              MessageRetentionPeriod: 345600
              ReceiveMessageWaitTimeSeconds: 20
              VisibilityTimeout: 180
              RedrivePolicy:
                deadLetterTargetArn:
                  Fn::GetAtt:
                    - DLQ
                    - Arn
                maxReceiveCount: 5
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          TLS:
            Type: AWS::SQS::QueuePolicy
            Properties:
              Queues:
                - Ref: Queue
                - Ref: DLQ
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Deny
                    Principal: '*'
                    Action: sqs:*
                    Resource:
                      - Fn::GetAtt:
                          - Queue
                          - Arn
                      - Fn::GetAtt:
                          - DLQ
                          - Arn
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                        aws:PrincipalIsAWSService: 'false'
          SqsPublishAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Send messages to this queue, including batch sends.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - sqs:SendMessage
                      - sqs:GetQueueUrl
                      - sqs:GetQueueAttributes
                    Resource:
                      Fn::GetAtt:
                        - Queue
                        - Arn
          SqsReceiveAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Receive, acknowledge and change visibility of messages in this queue.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - sqs:ReceiveMessage
                      - sqs:DeleteMessage
                      - sqs:ChangeMessageVisibility
                      - sqs:GetQueueUrl
                      - sqs:GetQueueAttributes
                    Resource:
                      Fn::GetAtt:
                        - Queue
                        - Arn
          SqsDlqReceiveAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Inspect and acknowledge messages in the dead-letter queue.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - sqs:ReceiveMessage
                      - sqs:DeleteMessage
                      - sqs:ChangeMessageVisibility
                      - sqs:GetQueueUrl
                      - sqs:GetQueueAttributes
                    Resource:
                      Fn::GetAtt:
                        - DLQ
                        - Arn
        Outputs:
          QueueArn:
            Value:
              Fn::GetAtt:
                - Queue
                - Arn
          DLQArn:
            Value:
              Fn::GetAtt:
                - DLQ
                - Arn
          SqsPublishAccessArn:
            Description: 'Optional policy: Send messages to this queue, including batch sends. Attach to a role, user or group when needed.'
            Value:
              Ref: SqsPublishAccess
          SqsReceiveAccessArn:
            Description: 'Optional policy: Receive, acknowledge and change visibility of messages in this queue. Attach to a role, user or group when needed.'
            Value:
              Ref: SqsReceiveAccess
          SqsDlqReceiveAccessArn:
            Description: 'Optional policy: Inspect and acknowledge messages in the dead-letter queue. Attach to a role, user or group when needed.'
            Value:
              Ref: SqsDlqReceiveAccess
    - id: service-sns
      title: SNS
      env:
        - name: NAME
          example: my-topic
          required: true
          type: string
          hint: ''
          pattern: '[A-Za-z0-9][A-Za-z0-9_.-]{0,63}'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: sns
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Topic:
            Type: AWS::SNS::Topic
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              TopicName:
                Ref: Name
              KmsMasterKeyId: alias/aws/sns
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          TLS:
            Type: AWS::SNS::TopicPolicy
            Properties:
              Topics:
                - Ref: Topic
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Deny
                    Principal: '*'
                    Action: sns:*
                    Resource:
                      Ref: Topic
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                        aws:PrincipalIsAWSService: 'false'
          SnsPublishAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Publish to this encrypted topic with its AWS-managed SNS key.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - sns:Publish
                      - sns:GetTopicAttributes
                    Resource:
                      Ref: Topic
                  - Effect: Allow
                    Action:
                      - kms:GenerateDataKey
                      - kms:Decrypt
                    Resource:
                      Fn::Sub: arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
                    Condition:
                      StringEquals:
                        kms:ViaService:
                          Fn::Sub: sns.${AWS::Region}.${AWS::URLSuffix}
                        kms:CallerAccount:
                          Ref: AWS::AccountId
                        kms:EncryptionContext:aws:sns:topicArn:
                          Ref: Topic
                      ForAnyValue:StringEquals:
                        kms:ResourceAliases: alias/aws/sns
        Outputs:
          TopicArn:
            Value:
              Ref: Topic
          SnsPublishAccessArn:
            Description: 'Optional policy: Publish to this encrypted topic with its AWS-managed SNS key. Attach to a role, user or group when needed.'
            Value:
              Ref: SnsPublishAccess
    - id: service-dynamodb
      title: DynamoDB
      env:
        - name: NAME
          example: my-table
          required: true
          type: string
          hint: String partition key pk and sort key sk. On-demand capacity, AWS-owned encryption, 35-day recovery, deletion protection and TTL on expiresAt (Unix seconds; omit it for permanent items).
          pattern: '[A-Za-z0-9_.-]{3,64}'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: dynamodb
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Description: On-demand table with string pk/sk keys, AWS-owned encryption, 35-day point-in-time recovery, deletion protection, expiresAt TTL and HTTPS-only access.
        Parameters:
          Name:
            Type: String
            AllowedPattern: '[A-Za-z0-9_.-]{3,64}'
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Table:
            Type: AWS::DynamoDB::Table
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              TableName:
                Ref: Name
              BillingMode: PAY_PER_REQUEST
              TableClass: STANDARD
              AttributeDefinitions:
                - AttributeName: pk
                  AttributeType: S
                - AttributeName: sk
                  AttributeType: S
              KeySchema:
                - AttributeName: pk
                  KeyType: HASH
                - AttributeName: sk
                  KeyType: RANGE
              SSESpecification:
                SSEEnabled: false
              PointInTimeRecoverySpecification:
                PointInTimeRecoveryEnabled: true
                RecoveryPeriodInDays: 35
              TimeToLiveSpecification:
                AttributeName: expiresAt
                Enabled: true
              DeletionProtectionEnabled: true
              ResourcePolicy:
                PolicyDocument:
                  Version: 2012-10-17
                  Statement:
                    - Sid: RequireTLS
                      Effect: Deny
                      Principal: '*'
                      Action: dynamodb:*
                      Resource:
                        - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Name}
                        - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Name}/index/*
                      Condition:
                        Bool:
                          aws:SecureTransport: 'false'
                          aws:PrincipalIsAWSService: 'false'
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          DynamoReadAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Read, query and scan this table and its indexes.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - dynamodb:GetItem
                      - dynamodb:BatchGetItem
                      - dynamodb:DescribeTable
                    Resource:
                      Fn::GetAtt:
                        - Table
                        - Arn
                  - Effect: Allow
                    Action:
                      - dynamodb:Query
                      - dynamodb:Scan
                    Resource:
                      - Fn::GetAtt:
                          - Table
                          - Arn
                      - Fn::Sub: ${Table.Arn}/index/*
          DynamoWriteAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Create, update and delete items, including batch and transactional writes.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
