        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Workgroup:
            Type: AWS::Athena::WorkGroup
            Properties:
              Name:
                Ref: Name
              WorkGroupConfiguration:
                EnforceWorkGroupConfiguration: true
                ManagedQueryResultsConfiguration:
                  Enabled: true
                PublishCloudWatchMetricsEnabled: true
                BytesScannedCutoffPerQuery: 1073741824
                RequesterPaysEnabled: false
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
        Outputs: {}
    - id: service-kinesis
      title: Kinesis
      env:
        - name: NAME
          example: my-stream
          required: true
          type: string
          hint: ''
          pattern: '[A-Za-z0-9][A-Za-z0-9_.-]{0,63}'
        - name: TAG_KEY
