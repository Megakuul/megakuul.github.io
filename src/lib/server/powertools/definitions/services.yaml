    - id: service-appconfig
      title: AppConfig
      env:
        - name: NAME
          example: my-app
          required: true
          type: string
          hint: ''
          pattern: '[A-Za-z0-9][A-Za-z0-9_.-]{0,63}'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: appconfig
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Application:
            Type: AWS::AppConfig::Application
            Properties:
              Name:
                Ref: Name
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Environment:
            Type: AWS::AppConfig::Environment
            Properties:
              ApplicationId:
                Ref: Application
              Name: test
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Profile:
            Type: AWS::AppConfig::ConfigurationProfile
            Properties:
              ApplicationId:
                Ref: Application
              Name: settings
              LocationUri: hosted
              Type: AWS.Freeform
              Validators:
                - Type: JSON_SCHEMA
                  Content: '{"type":"object"}'
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Strategy:
            Type: AWS::AppConfig::DeploymentStrategy
            Properties:
              Name:
                Fn::Sub: ${Name}-gradual
              DeploymentDurationInMinutes: 10
              FinalBakeTimeInMinutes: 10
              GrowthFactor: 20
              GrowthType: LINEAR
              ReplicateTo: NONE
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          AppConfigReadAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Poll the created environment and configuration profile.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - appconfig:StartConfigurationSession
                      - appconfig:GetLatestConfiguration
                    Resource:
                      Fn::Sub: arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:application/${Application}/environment/${Environment}/configuration/${Profile}
          AppConfigDeployAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Publish hosted versions and deploy them with the created strategy.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - appconfig:CreateHostedConfigurationVersion
                      - appconfig:GetHostedConfigurationVersion
                    Resource:
                      - Fn::Sub: arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:application/${Application}
                      - Fn::Sub: arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:application/${Application}/configurationprofile/${Profile}
                  - Effect: Allow
                    Action: appconfig:StartDeployment
                    Resource:
                      - Fn::Sub: arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:application/${Application}
                      - Fn::Sub: arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:application/${Application}/configurationprofile/${Profile}
                      - Fn::Sub: arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:application/${Application}/environment/${Environment}
                      - Fn::Sub: arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:deploymentstrategy/${Strategy}
                  - Effect: Allow
                    Action:
                      - appconfig:GetDeployment
                      - appconfig:StopDeployment
                    Resource:
                      - Fn::Sub: arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:application/${Application}
                      - Fn::Sub: arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:application/${Application}/environment/${Environment}
                      - Fn::Sub: arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:application/${Application}/environment/${Environment}/deployment/*
        Outputs:
          ApplicationId:
            Value:
              Ref: Application
          EnvironmentId:
            Value:
              Ref: Environment
          ProfileId:
            Value:
              Ref: Profile
          AppConfigReadAccessArn:
            Description: 'Optional policy: Poll the created environment and configuration profile. Attach to a role, user or group when needed.'
            Value:
              Ref: AppConfigReadAccess
          AppConfigDeployAccessArn:
            Description: 'Optional policy: Publish hosted versions and deploy them with the created strategy. Attach to a role, user or group when needed.'
            Value:
              Ref: AppConfigDeployAccess
    - id: service-states
      title: Step Functions
      env:
        - name: NAME
          example: my-workflow
          required: true
          type: string
          hint: ''
          pattern: '[A-Za-z0-9][A-Za-z0-9_.-]{0,63}'
        - name: ROLE_NAME
          example: my-app-role
          required: true
          type: string
          hint: Existing execution role; paste the required service permissions into its bound policy.
          pattern: '[A-Za-z0-9+=,.@_-]{1,64}'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: states
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          RoleArn:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Logs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: /aws/vendedlogs/states/${Name}
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          StateMachine:
            Type: AWS::StepFunctions::StateMachine
            Properties:
              StateMachineName:
                Ref: Name
              StateMachineType: STANDARD
              RoleArn:
                Ref: RoleArn
              Definition:
                StartAt: ConfigureWorkflow
                States:
                  ConfigureWorkflow:
                    Type: Fail
                    Error: NotConfigured
                    Cause: Replace with your workflow.
              LoggingConfiguration:
                Level: ERROR
                IncludeExecutionData: false
                Destinations:
                  - CloudWatchLogsLogGroup:
                      LogGroupArn:
                        Fn::GetAtt:
                          - Logs
                          - Arn
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          StatesStartAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Start this state machine, including its versions and aliases.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action: states:StartExecution
                    Resource:
                      - Ref: StateMachine
                      - Fn::Sub: ${StateMachine}:*
          StatesReadAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Describe this workflow and read its execution history.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - states:DescribeStateMachine
                      - states:ListExecutions
                    Resource:
                      - Ref: StateMachine
                      - Fn::Sub: ${StateMachine}:*
                  - Effect: Allow
                    Action:
                      - states:DescribeExecution
                      - states:GetExecutionHistory
                    Resource:
                      Fn::Sub: arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${Name}:*
          StatesStopAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Stop executions belonging to this workflow.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action: states:StopExecution
                    Resource:
                      Fn::Sub: arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${Name}:*
        Outputs:
          StateMachineArn:
            Value:
              Ref: StateMachine
          StatesStartAccessArn:
            Description: 'Optional policy: Start this state machine, including its versions and aliases. Attach to a role, user or group when needed.'
            Value:
              Ref: StatesStartAccess
          StatesReadAccessArn:
            Description: 'Optional policy: Describe this workflow and read its execution history. Attach to a role, user or group when needed.'
            Value:
              Ref: StatesReadAccess
          StatesStopAccessArn:
            Description: 'Optional policy: Stop executions belonging to this workflow. Attach to a role, user or group when needed.'
            Value:
              Ref: StatesStopAccess
    - id: service-athena
      title: Athena
      env:
        - name: NAME
          example: my-workgroup
          required: true
