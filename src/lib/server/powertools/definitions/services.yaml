            Type: String
            Default: powertools
        Resources:
          Bus:
            Type: AWS::Events::EventBus
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Name:
                Ref: Name
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
        Outputs:
          BusArn:
            Value:
              Fn::GetAtt:
                - Bus
                - Arn
    - id: service-ecr
      title: ECR
      env:
        - name: NAME
          example: my-app/backend
          required: true
          type: string
          hint: ''
          pattern: '[a-z0-9]+(?:[._/-][a-z0-9]+)*'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: ecr
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Repository:
            Type: AWS::ECR::Repository
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              RepositoryName:
                Ref: Name
              ImageTagMutability: IMMUTABLE
              ImageScanningConfiguration:
                ScanOnPush: true
              EncryptionConfiguration:
                EncryptionType: AES256
              LifecyclePolicy:
                LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Expire old untagged images","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":30},"action":{"type":"expire"}}]}'
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
        Outputs:
          RepositoryArn:
            Value:
              Fn::GetAtt:
                - Repository
                - Arn
    - id: service-ecs
      title: ECS
      env:
        - name: NAME
          example: my-cluster
          required: true
          type: string
          hint: ''
          pattern: '[A-Za-z0-9][A-Za-z0-9_.-]{0,63}'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: ecs
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          ExecLogs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: /aws/ecs/${Name}/exec
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Cluster:
            Type: AWS::ECS::Cluster
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              ClusterName:
                Ref: Name
              Configuration:
                ExecuteCommandConfiguration:
                  Logging: OVERRIDE
                  LogConfiguration:
                    CloudWatchLogGroupName:
                      Ref: ExecLogs
              ClusterSettings:
                - Name: containerInsights
                  Value: enhanced
              CapacityProviders:
                - FARGATE
                - FARGATE_SPOT
              DefaultCapacityProviderStrategy:
                - CapacityProvider: FARGATE
                  Weight: 1
                  Base: 1
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
        Outputs:
          ClusterArn:
            Value:
              Fn::GetAtt:
                - Cluster
                - Arn
    - id: service-logs
      title: CloudWatch Logs
      env:
        - name: NAME
          example: /app/my-app
          required: true
          type: string
          hint: ''
          pattern: "[.\\-_/#A-Za-z0-9]{1,512}"
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: logs
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Logs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Ref: Name
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
        Outputs:
          LogGroup:
            Value:
              Ref: Logs
    - id: service-secret
      title: Secrets Manager
      env:
        - name: NAME
          example: my-app/database
          required: true
          type: string
          hint: ''
          pattern: '[A-Za-z0-9/_+=.@-]{1,512}'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: secret
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Secret:
            Type: AWS::SecretsManager::Secret
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Name:
                Ref: Name
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
        Outputs:
          SecretArn:
            Value:
              Ref: Secret
    - id: service-appconfig
      title: AppConfig
      env:
        - name: NAME
          example: my-app
          required: true
          type: string
          hint: ''
          pattern: '[A-Za-z0-9][A-Za-z0-9_.-]{0,63}'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: appconfig
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Application:
            Type: AWS::AppConfig::Application
            Properties:
              Name:
                Ref: Name
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Environment:
            Type: AWS::AppConfig::Environment
            Properties:
              ApplicationId:
                Ref: Application
              Name: test
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Profile:
            Type: AWS::AppConfig::ConfigurationProfile
            Properties:
              ApplicationId:
                Ref: Application
              Name: settings
              LocationUri: hosted
              Type: AWS.Freeform
              Validators:
                - Type: JSON_SCHEMA
                  Content: '{"type":"object"}'
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Strategy:
            Type: AWS::AppConfig::DeploymentStrategy
            Properties:
              Name:
                Fn::Sub: ${Name}-gradual
              DeploymentDurationInMinutes: 10
              FinalBakeTimeInMinutes: 10
              GrowthFactor: 20
              GrowthType: LINEAR
              ReplicateTo: NONE
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
        Outputs:
          ApplicationId:
            Value:
              Ref: Application
          EnvironmentId:
            Value:
              Ref: Environment
          ProfileId:
            Value:
              Ref: Profile
    - id: service-states
      title: Step Functions
      env:
        - name: NAME
          example: my-workflow
          required: true
          type: string
          hint: ''
          pattern: '[A-Za-z0-9][A-Za-z0-9_.-]{0,63}'
        - name: ROLE_NAME
          example: my-app-role
          required: true
          type: string
          hint: Existing execution role; paste the required service permissions into its bound policy.
          pattern: '[A-Za-z0-9+=,.@_-]{1,64}'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: states
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          RoleArn:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Logs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: /aws/vendedlogs/states/${Name}
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          StateMachine:
            Type: AWS::StepFunctions::StateMachine
            Properties:
              StateMachineName:
                Ref: Name
              StateMachineType: STANDARD
              RoleArn:
                Ref: RoleArn
              Definition:
                StartAt: ConfigureWorkflow
                States:
                  ConfigureWorkflow:
                    Type: Fail
                    Error: NotConfigured
                    Cause: Replace with your workflow.
              LoggingConfiguration:
                Level: ERROR
                IncludeExecutionData: false
                Destinations:
                  - CloudWatchLogsLogGroup:
                      LogGroupArn:
                        Fn::GetAtt:
                          - Logs
                          - Arn
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
        Outputs:
          StateMachineArn:
            Value:
              Ref: StateMachine
    - id: service-athena
      title: Athena
      env:
        - name: NAME
          example: my-workgroup
          required: true
          type: string
          hint: ''
          pattern: '[A-Za-z0-9][A-Za-z0-9_.-]{0,63}'
        - name: TAG_KEY
