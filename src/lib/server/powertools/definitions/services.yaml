            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Name:
                Ref: Name
              StreamModeDetails:
                StreamMode: ON_DEMAND
              RetentionPeriodHours: 72
              StreamEncryption:
                EncryptionType: KMS
                KeyId: alias/aws/kinesis
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          TLS:
            Type: AWS::Kinesis::ResourcePolicy
            Properties:
              ResourceArn:
                Fn::GetAtt:
                  - Stream
                  - Arn
              ResourcePolicy:
                Version: 2012-10-17
                Statement:
                  - Effect: Deny
                    Principal: '*'
                    Action: kinesis:*
                    Resource:
                      Fn::GetAtt:
                        - Stream
                        - Arn
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                        aws:PrincipalIsAWSService: 'false'
        Outputs:
          StreamArn:
            Value:
              Fn::GetAtt:
                - Stream
                - Arn
    - id: service-security
      title: GuardDuty and IAM Access Analyzer
      env:
        - name: NAME
          example: account-access
          required: true
          type: string
          pattern: '[A-Za-z][A-Za-z0-9_-]{0,254}'
          hint: External-access analyzer name. Reuses an existing account external-access analyzer in REGION, even if named differently.
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: security
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Detector:
            Type: AWS::GuardDuty::Detector
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Enable: true
              FindingPublishingFrequency: FIFTEEN_MINUTES
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Analyzer:
            Type: AWS::AccessAnalyzer::Analyzer
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              AnalyzerName:
                Ref: Name
              Type: ACCOUNT
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
        Outputs:
          DetectorId:
            Value:
              Ref: Detector
          AnalyzerArn:
            Value:
              Fn::GetAtt:
                - Analyzer
                - Arn
      cli: security
