            Type: String
            Default: powertools
        Resources:
          Topic:
            Type: AWS::SNS::Topic
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              TopicName:
                Ref: Name
              KmsMasterKeyId: alias/aws/sns
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          TLS:
            Type: AWS::SNS::TopicPolicy
            Properties:
              Topics:
                - Ref: Topic
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Deny
                    Principal: '*'
                    Action: sns:*
                    Resource:
                      Ref: Topic
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                        aws:PrincipalIsAWSService: 'false'
        Outputs:
          TopicArn:
            Value:
              Ref: Topic
    - id: service-eventbridge
