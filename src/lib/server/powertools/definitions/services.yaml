                - Table
                - Arn
          DynamoReadAccessArn:
            Description: 'Optional policy: Read, query and scan this table and its indexes. Attach to a role, user or group when needed.'
            Value:
              Ref: DynamoReadAccess
          DynamoWriteAccessArn:
            Description: 'Optional policy: Create, update and delete items, including batch and transactional writes. Attach to a role, user or group when needed.'
            Value:
