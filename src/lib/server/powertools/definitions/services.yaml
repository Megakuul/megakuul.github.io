- id: services
  title: Services
  recipes:
    - id: service-lambda
      title: Lambda
      env:
        - name: NAME
          example: my-function
          required: true
          type: string
          hint: ''
          pattern: '[A-Za-z0-9][A-Za-z0-9_.-]{0,63}'
        - name: ROLE_NAME
          example: my-app-role
          required: true
          type: string
          hint: Existing execution role; paste the required service permissions into its bound policy.
          pattern: '[A-Za-z0-9+=,.@_-]{1,64}'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: lambda
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          RoleArn:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Logs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: /aws/lambda/${Name}
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Function:
            Type: AWS::Lambda::Function
            Properties:
              FunctionName:
                Ref: Name
              Runtime: nodejs24.x
              Handler: index.handler
              Role:
                Ref: RoleArn
              Code:
                ZipFile: exports.handler=async()=>{throw new Error("Deploy application code before invoking this function.");};
              MemorySize: 256
              Timeout: 10
              Architectures:
                - arm64
              LoggingConfig:
                LogFormat: JSON
                ApplicationLogLevel: INFO
                SystemLogLevel: INFO
                LogGroup:
                  Ref: Logs
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Retries:
            Type: AWS::Lambda::EventInvokeConfig
            Properties:
              FunctionName:
                Ref: Function
              Qualifier: $LATEST
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600
        Outputs:
          FunctionArn:
            Value:
              Fn::GetAtt:
                - Function
                - Arn
    - id: service-s3
      title: S3
      env:
        - name: NAME
          example: my-app-bucket-111122223333
          required: true
          type: string
          hint: ''
          pattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: s3
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          AccessLogs:
            Type: AWS::S3::Bucket
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              OwnershipControls:
                Rules:
                  - ObjectOwnership: BucketOwnerEnforced
              PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                IgnorePublicAcls: true
                BlockPublicPolicy: true
                RestrictPublicBuckets: true
              BucketEncryption:
                ServerSideEncryptionConfiguration:
                  - ServerSideEncryptionByDefault:
                      SSEAlgorithm: AES256
              VersioningConfiguration:
                Status: Enabled
              LifecycleConfiguration:
                Rules:
                  - Id: AbortIncompleteUploads
                    Status: Enabled
                    AbortIncompleteMultipartUpload:
                      DaysAfterInitiation: 7
                  - Id: OldVersions
                    Prefix: ''
                    Status: Enabled
                    NoncurrentVersionExpiration:
                      NoncurrentDays: 90
                      NewerNoncurrentVersions: 5
                  - Id: ExpireLogs
                    Status: Enabled
                    ExpirationInDays: 90
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          LogPolicy:
            Type: AWS::S3::BucketPolicy
            Properties:
              Bucket:
                Ref: AccessLogs
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Deny
                    Principal: '*'
                    Action: s3:*
                    Resource:
                      - Fn::GetAtt:
                          - AccessLogs
                          - Arn
                      - Fn::Sub: ${AccessLogs.Arn}/*
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                        aws:PrincipalIsAWSService: 'false'
                  - Effect: Allow
                    Principal:
                      Service: logging.s3.amazonaws.com
                    Action: s3:PutObject
                    Resource:
                      Fn::Sub: ${AccessLogs.Arn}/access/*
                    Condition:
                      StringEquals:
                        aws:SourceAccount:
                          Ref: AWS::AccountId
                      ArnLike:
                        aws:SourceArn:
                          Fn::Sub: arn:${AWS::Partition}:s3:::${Name}
          Bucket:
            Type: AWS::S3::Bucket
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              BucketName:
                Ref: Name
              OwnershipControls:
                Rules:
                  - ObjectOwnership: BucketOwnerEnforced
              PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                IgnorePublicAcls: true
                BlockPublicPolicy: true
                RestrictPublicBuckets: true
              BucketEncryption:
                ServerSideEncryptionConfiguration:
                  - ServerSideEncryptionByDefault:
                      SSEAlgorithm: AES256
              VersioningConfiguration:
                Status: Enabled
              LifecycleConfiguration:
                Rules:
                  - Id: AbortIncompleteUploads
                    Status: Enabled
                    AbortIncompleteMultipartUpload:
                      DaysAfterInitiation: 7
                  - Id: OldVersions
                    Prefix: ''
                    Status: Enabled
                    NoncurrentVersionExpiration:
                      NoncurrentDays: 90
                      NewerNoncurrentVersions: 5
              LoggingConfiguration:
                DestinationBucketName:
                  Ref: AccessLogs
                LogFilePrefix: access/
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
            DependsOn: LogPolicy
          Policy:
            Type: AWS::S3::BucketPolicy
            Properties:
              Bucket:
                Ref: Bucket
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Deny
                    Principal: '*'
                    Action: s3:*
                    Resource:
                      - Fn::GetAtt:
                          - Bucket
                          - Arn
                      - Fn::Sub: ${Bucket.Arn}/*
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                        aws:PrincipalIsAWSService: 'false'
                  - Effect: Deny
                    Principal: '*'
                    Action: s3:PutObject
                    Resource:
                      Fn::Sub: ${Bucket.Arn}/*
                    Condition:
                      'Null':
                        s3:x-amz-server-side-encryption-customer-algorithm: 'false'
        Outputs:
          Bucket:
            Value:
              Ref: Bucket
    - id: service-sqs
      title: SQS
      env:
        - name: NAME
          example: my-queue
          required: true
          type: string
          hint: Add .fifo to NAME for a FIFO queue; a matching DLQ is created automatically.
          pattern: "[A-Za-z0-9_-]{1,70}(?:\\.fifo)?"
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: sqs
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          Name:
            Type: String
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          DLQ:
            Type: AWS::SQS::Queue
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              QueueName:
                Fn::Sub: ${Name}-dlq
              SqsManagedSseEnabled: true
              MessageRetentionPeriod: 1209600
              ReceiveMessageWaitTimeSeconds: 20
              VisibilityTimeout: 180
              RedriveAllowPolicy:
                redrivePermission: allowAll
              Tags:
                - Key: MonitoringRole
                  Value: dlq
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Queue:
            Type: AWS::SQS::Queue
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              QueueName:
                Ref: Name
              SqsManagedSseEnabled: true
              MessageRetentionPeriod: 345600
              ReceiveMessageWaitTimeSeconds: 20
              VisibilityTimeout: 180
              RedrivePolicy:
                deadLetterTargetArn:
                  Fn::GetAtt:
                    - DLQ
                    - Arn
                maxReceiveCount: 5
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          TLS:
            Type: AWS::SQS::QueuePolicy
            Properties:
              Queues:
                - Ref: Queue
                - Ref: DLQ
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Deny
                    Principal: '*'
                    Action: sqs:*
                    Resource:
                      - Fn::GetAtt:
                          - Queue
                          - Arn
                      - Fn::GetAtt:
                          - DLQ
                          - Arn
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                        aws:PrincipalIsAWSService: 'false'
        Outputs:
          QueueArn:
            Value:
              Fn::GetAtt:
                - Queue
                - Arn
          DLQArn:
            Value:
              Fn::GetAtt:
                - DLQ
                - Arn
    - id: service-sns
      title: SNS
      env:
        - name: NAME
          example: my-topic
