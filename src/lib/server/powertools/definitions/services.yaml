              OwnershipControls:
                Rules:
                  - ObjectOwnership: BucketOwnerEnforced
              VersioningConfiguration:
                Status: Enabled
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
              LifecycleConfiguration:
                Rules:
                  - Id: Cleanup
                    Status: Enabled
                    AbortIncompleteMultipartUpload:
                      DaysAfterInitiation: 1
                    NoncurrentVersionExpiration:
                      NoncurrentDays: 90
          TLS:
            Type: AWS::S3::BucketPolicy
            Properties:
              Bucket:
                Ref: Bucket
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Deny
                    Principal: '*'
                    Action: s3:*
                    Resource:
                      - Fn::GetAtt:
                          - Bucket
                          - Arn
                      - Fn::Sub: ${Bucket.Arn}/*
                    Condition:
                      Bool:
                        aws:SecureTransport: 'false'
                        aws:PrincipalIsAWSService: 'false'
          Logs:
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              LogGroupName:
                Fn::Sub: /aws/kinesisfirehose/${Name}
              RetentionInDays: 30
              DeletionProtectionEnabled: true
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          LogStream:
            Type: AWS::Logs::LogStream
            Properties:
              LogGroupName:
                Ref: Logs
              LogStreamName: S3Delivery
          DeliveryRole:
            Type: AWS::IAM::Role
            Properties:
              AssumeRolePolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: firehose.amazonaws.com
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        sts:ExternalId:
                          Ref: AWS::AccountId
              Policies:
                - PolicyName: ServiceAccess
                  PolicyDocument:
                    Version: 2012-10-17
                    Statement:
                      - Effect: Allow
                        Action:
                          - s3:GetBucketLocation
                          - s3:ListBucket
                          - s3:ListBucketMultipartUploads
                        Resource:
                          Fn::GetAtt:
                            - Bucket
                            - Arn
                      - Effect: Allow
                        Action:
                          - s3:GetObject
                          - s3:PutObject
                          - s3:AbortMultipartUpload
                        Resource:
                          Fn::Sub: ${Bucket.Arn}/*
                      - Effect: Allow
                        Action: logs:PutLogEvents
                        Resource:
                          Fn::GetAtt:
                            - Logs
                            - Arn
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Stream:
            Type: AWS::KinesisFirehose::DeliveryStream
            DependsOn:
              - TLS
            Properties:
              DeliveryStreamName:
                Ref: Name
              DeliveryStreamType: DirectPut
              DeliveryStreamEncryptionConfigurationInput:
                KeyType: AWS_OWNED_CMK
              ExtendedS3DestinationConfiguration:
                BucketARN:
                  Fn::GetAtt:
                    - Bucket
                    - Arn
                RoleARN:
                  Fn::GetAtt:
                    - DeliveryRole
                    - Arn
                Prefix: data/
                ErrorOutputPrefix: errors/!{firehose:error-output-type}/
                BufferingHints:
                  IntervalInSeconds: 60
                  SizeInMBs: 1
                CompressionFormat: GZIP
                CloudWatchLoggingOptions:
                  Enabled: true
                  LogGroupName:
                    Ref: Logs
                  LogStreamName:
                    Ref: LogStream
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          DeliveryAlarm:
            Type: AWS::CloudWatch::Alarm
            Properties:
              AlarmDescription: Firehose S3 delivery is falling behind
              Namespace: AWS/Firehose
              MetricName: DeliveryToS3.DataFreshness
              Dimensions:
                - Name: DeliveryStreamName
                  Value:
                    Ref: Name
              Statistic: Maximum
              Period: 300
              EvaluationPeriods: 2
              Threshold: 900
              ComparisonOperator: GreaterThanThreshold
              TreatMissingData: notBreaching
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          FirehosePublishAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Put records and batches into this delivery stream.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - firehose:PutRecord
                      - firehose:PutRecordBatch
                      - firehose:DescribeDeliveryStream
                    Resource:
                      Fn::GetAtt:
                        - Stream
                        - Arn
          FirehoseReadAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Read delivered data in the data/ prefix of the destination bucket.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - s3:GetBucketLocation
                    Resource:
                      Fn::GetAtt:
                        - Bucket
                        - Arn
                  - Effect: Allow
                    Action:
                      - s3:ListBucket
                      - s3:ListBucketVersions
                    Resource:
                      Fn::GetAtt:
                        - Bucket
                        - Arn
                    Condition:
                      StringLike:
                        s3:prefix:
                          - data
                          - data/*
                  - Effect: Allow
                    Action:
                      - s3:GetObject
                      - s3:GetObjectVersion
                    Resource:
                      Fn::Sub: ${Bucket.Arn}/data/*
        Outputs:
          StreamArn:
            Value:
              Fn::GetAtt:
                - Stream
                - Arn
          BucketName:
            Value:
              Ref: Bucket
          FirehosePublishAccessArn:
            Description: 'Optional policy: Put records and batches into this delivery stream. Attach to a role, user or group when needed.'
            Value:
              Ref: FirehosePublishAccess
          FirehoseReadAccessArn:
            Description: 'Optional policy: Read delivered data in the data/ prefix of the destination bucket. Attach to a role, user or group when needed.'
            Value:
              Ref: FirehoseReadAccess
    - id: service-glue-security
      title: Glue Security Defaults
      env:
        - name: NAME
          example: my-glue-security
          required: true
          hint: Creates the key, role and encryption configuration; enables catalog encryption now. Select the role and security configuration when creating jobs/crawlers, then grant access to your data buckets.
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: glue-security
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Description: Creates a rotating KMS key, Glue execution role and security configuration for encrypted S3 job output, CloudWatch logs and job bookmarks. Enables catalog metadata/connection-password encryption in this account/region immediately. Select this role/configuration for jobs and crawlers; grant workload S3 access separately. Other catalog readers need permission to decrypt with this key.
        Parameters:
          Name:
            Type: String
            AllowedPattern: '[a-z][a-z0-9-]{2,23}'
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Key:
            Type: AWS::KMS::Key
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description:
                Fn::Sub: ${Name} Glue encryption
              KeySpec: SYMMETRIC_DEFAULT
              KeyUsage: ENCRYPT_DECRYPT
              EnableKeyRotation: true
              PendingWindowInDays: 30
              KeyPolicy:
                Version: 2012-10-17
                Statement:
                  - Sid: AccountKeyAdministration
                    Effect: Allow
                    Principal:
                      AWS:
                        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
                    Action: kms:*
                    Resource: '*'
                  - Sid: GlueCloudWatchLogs
                    Effect: Allow
                    Principal:
                      Service:
                        Fn::Sub: logs.${AWS::Region}.${AWS::URLSuffix}
                    Action:
                      - kms:Encrypt
                      - kms:Decrypt
                      - kms:ReEncrypt*
                      - kms:GenerateDataKey*
                      - kms:DescribeKey
                    Resource: '*'
                    Condition:
                      ArnLike:
                        kms:EncryptionContext:aws:logs:arn:
                          Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          KeyAlias:
            Type: AWS::KMS::Alias
            Properties:
              AliasName:
                Fn::Sub: alias/${Name}
              TargetKeyId:
                Ref: Key
          GlueRole:
            Type: AWS::IAM::Role
            Properties:
              AssumeRolePolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: glue.amazonaws.com
                    Action: sts:AssumeRole
              ManagedPolicyArns:
                - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSGlueServiceRole
              Policies:
                - PolicyName: EncryptionAccess
                  PolicyDocument:
                    Version: 2012-10-17
                    Statement:
                      - Effect: Allow
                        Action:
                          - kms:Encrypt
                          - kms:Decrypt
                          - kms:ReEncrypt*
                          - kms:GenerateDataKey*
                          - kms:DescribeKey
                        Resource:
                          Fn::GetAtt:
                            - Key
                            - Arn
                      - Effect: Allow
                        Action: logs:AssociateKmsKey
                        Resource:
                          Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Security:
            Type: AWS::Glue::SecurityConfiguration
            Properties:
              Name:
                Ref: Name
              EncryptionConfiguration:
                S3Encryptions:
                  - S3EncryptionMode: SSE-KMS
                    KmsKeyArn:
                      Fn::GetAtt:
                        - Key
                        - Arn
                CloudWatchEncryption:
                  CloudWatchEncryptionMode: SSE-KMS
                  KmsKeyArn:
                    Fn::GetAtt:
                      - Key
                      - Arn
                JobBookmarksEncryption:
                  JobBookmarksEncryptionMode: CSE-KMS
                  KmsKeyArn:
                    Fn::GetAtt:
                      - Key
                      - Arn
          Catalog:
            Type: AWS::Glue::DataCatalogEncryptionSettings
            Properties:
              CatalogId:
                Ref: AWS::AccountId
              DataCatalogEncryptionSettings:
                EncryptionAtRest:
                  CatalogEncryptionMode: SSE-KMS
                  SseAwsKmsKeyId:
                    Fn::GetAtt:
                      - Key
                      - Arn
                ConnectionPasswordEncryption:
                  ReturnConnectionPasswordEncrypted: true
                  KmsKeyId:
                    Fn::GetAtt:
                      - Key
                      - Arn
          GlueDecryptAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Decrypt data protected by the created Glue KMS key.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - kms:Decrypt
                      - kms:DescribeKey
                    Resource:
                      Fn::GetAtt:
                        - Key
                        - Arn
          GlueEncryptAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Encrypt and decrypt data with the created Glue KMS key.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - kms:Encrypt
                      - kms:Decrypt
                      - kms:GenerateDataKey
                      - kms:ReEncryptFrom
                      - kms:ReEncryptTo
                      - kms:DescribeKey
                    Resource:
                      Fn::GetAtt:
                        - Key
                        - Arn
        Outputs:
          SecurityConfiguration:
            Value:
              Ref: Security
          KeyArn:
            Value:
              Fn::GetAtt:
                - Key
                - Arn
          RoleArn:
            Value:
              Fn::GetAtt:
                - GlueRole
                - Arn
          GlueDecryptAccessArn:
            Description: 'Optional policy: Decrypt data protected by the created Glue KMS key. Attach to a role, user or group when needed.'
            Value:
              Ref: GlueDecryptAccess
          GlueEncryptAccessArn:
            Description: 'Optional policy: Encrypt and decrypt data with the created Glue KMS key. Attach to a role, user or group when needed.'
            Value:
              Ref: GlueEncryptAccess
    - id: service-scheduler
      title: EventBridge Scheduler
      env:
        - name: NAME
          example: my-scheduler
          required: true
        - name: TARGET_ARN
          example: arn:aws:lambda:eu-central-1:111122223333:function:worker:live
          required: true
          hint: Existing Lambda alias/version in this region. Configure the Lambda async failure destination separately.
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: scheduler
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Description: Hourly Lambda invocation with scoped role, retry limit, encrypted DLQ and alarm. DLQ catches scheduling/delivery failures, not function execution errors.
        Parameters:
          Name:
            Type: String
            AllowedPattern: '[a-z][a-z0-9-]{2,23}'
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
          TargetArn:
            Type: String
            Description: Existing Lambda alias/version in this region. Configure the Lambda async failure destination separately.
        Resources:
          DLQ:
            Type: AWS::SQS::Queue
            Properties:
              QueueName:
                Fn::Sub: ${Name}-dlq
              SqsManagedSseEnabled: true
              MessageRetentionPeriod: 1209600
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Group:
            Type: AWS::Scheduler::ScheduleGroup
            Properties:
              Name:
                Ref: Name
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          ExecutionRole:
            Type: AWS::IAM::Role
            Properties:
              AssumeRolePolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: scheduler.amazonaws.com
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        aws:SourceAccount:
                          Ref: AWS::AccountId
                      ArnLike:
                        aws:SourceArn:
                          Fn::Sub: arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/${Name}
              Policies:
                - PolicyName: ServiceAccess
                  PolicyDocument:
                    Version: 2012-10-17
                    Statement:
                      - Effect: Allow
                        Action: lambda:InvokeFunction
                        Resource:
                          Ref: TargetArn
                      - Effect: Allow
                        Action: sqs:SendMessage
                        Resource:
                          Fn::GetAtt:
                            - DLQ
                            - Arn
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          Schedule:
            Type: AWS::Scheduler::Schedule
            Properties:
              Name:
                Ref: Name
              GroupName:
                Ref: Group
              ScheduleExpression: rate(1 hour)
              FlexibleTimeWindow:
                Mode: OFF
              State: ENABLED
              Target:
                Arn:
                  Ref: TargetArn
                RoleArn:
                  Fn::GetAtt:
                    - ExecutionRole
                    - Arn
                Input: '{}'
                DeadLetterConfig:
                  Arn:
                    Fn::GetAtt:
                      - DLQ
                      - Arn
                RetryPolicy:
                  MaximumEventAgeInSeconds: 3600
                  MaximumRetryAttempts: 3
          DLQAlarm:
            Type: AWS::CloudWatch::Alarm
            Properties:
              AlarmDescription: Scheduler exhausted delivery retries
              Namespace: AWS/SQS
              MetricName: ApproximateNumberOfMessagesVisible
              Dimensions:
                - Name: QueueName
                  Value:
                    Fn::Sub: ${Name}-dlq
              Statistic: Maximum
              Period: 300
              EvaluationPeriods: 1
              Threshold: 0
              ComparisonOperator: GreaterThanThreshold
              TreatMissingData: notBreaching
              Tags:
                - Key:
                    Ref: TagKey
                  Value:
                    Ref: TagValue
          SchedulerReadAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Read this schedule and NAME-prefixed schedules in its group.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action: scheduler:GetSchedule
                    Resource:
                      - Fn::Sub: arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${Group}/${Name}
                      - Fn::Sub: arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${Group}/${Name}-*
                  - Effect: Allow
                    Action: scheduler:GetScheduleGroup
                    Resource:
                      Fn::Sub: arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/${Group}
          SchedulerManageAccess:
            Type: AWS::IAM::ManagedPolicy
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              Description: Manage NAME-prefixed schedules in this group using the created execution role.
              PolicyDocument:
                Version: 2012-10-17
                Statement:
                  - Effect: Allow
                    Action:
                      - scheduler:CreateSchedule
                      - scheduler:UpdateSchedule
                      - scheduler:DeleteSchedule
                      - scheduler:GetSchedule
                    Resource:
                      - Fn::Sub: arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${Group}/${Name}
                      - Fn::Sub: arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${Group}/${Name}-*
                  - Effect: Allow
                    Action: iam:PassRole
                    Resource:
                      Fn::GetAtt:
                        - ExecutionRole
                        - Arn
                    Condition:
                      StringEquals:
                        iam:PassedToService: scheduler.amazonaws.com
        Outputs:
          DeadLetterQueue:
            Value:
              Ref: DLQ
          SchedulerReadAccessArn:
            Description: 'Optional policy: Read this schedule and NAME-prefixed schedules in its group. Attach to a role, user or group when needed.'
            Value:
              Ref: SchedulerReadAccess
          SchedulerManageAccessArn:
            Description: 'Optional policy: Manage NAME-prefixed schedules in this group using the created execution role. Attach to a role, user or group when needed.'
            Value:
              Ref: SchedulerManageAccess
