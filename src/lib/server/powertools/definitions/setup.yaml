- id: setup
  title: Setup
  recipes:
    - id: security-groups-setup
      title: Security Groups
      env:
        - name: VPC_ID
          example: vpc-0123456789abcdef0
          required: true
        - name: SG_NAMES
          example: app,worker,database
          required: true
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: security-groups
      template:
        AWSTemplateFormatVersion: 2010-09-09
        Parameters:
          VpcId:
            Type: AWS::EC2::VPC::Id
          GroupNames:
            Type: CommaDelimitedList
            Default: app,worker,database
          TagKey:
            Type: String
            Default: Project
          TagValue:
            Type: String
            Default: powertools
        Resources:
          Fn::ForEach::SecurityGroups:
            - GroupName
            - Ref: GroupNames
            - SecurityGroup&{GroupName}:
                Type: AWS::EC2::SecurityGroup
                Properties:
                  VpcId:
                    Ref: VpcId
                  GroupName:
                    Ref: GroupName
                  GroupDescription: No ingress; outbound HTTP and HTTPS only
                  SecurityGroupIngress: []
                  SecurityGroupEgress:
                    - IpProtocol: tcp
                      FromPort: 80
                      ToPort: 80
                      CidrIp: 0.0.0.0/0
                    - IpProtocol: tcp
                      FromPort: 443
                      ToPort: 443
                      CidrIp: 0.0.0.0/0
                  Tags:
                    - Key:
                        Ref: TagKey
                      Value:
                        Ref: TagValue
        Transform: AWS::LanguageExtensions
        Outputs:
          VpcId:
            Value:
              Ref: VpcId
          GroupNames:
            Value:
              Fn::Join:
                - ','
                - Ref: GroupNames
    - id: logging-setup
      title: Logging
      env:
        - name: TAG_KEY
          example: Project
          required: true
        - name: TAG_VALUE
          example: my-app
          required: true
      templateName: logging
