          ServiceLogPolicy:
            Type: AWS::Logs::ResourcePolicy
            Properties:
              PolicyName:
                Fn::Sub: ${AWS::StackName}-service-logs
              PolicyDocument:
                Fn::Sub: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["logs:CreateLogStream","logs:PutLogEvents"],"Resource":["arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${OpenSearchApplicationLogs}:log-stream:*","arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${OpenSearchSearchLogs}:log-stream:*","arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${OpenSearchIndexLogs}:log-stream:*","arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${OpenSearchAuditLogs}:log-stream:*"],"Principal":{"Service":"es.amazonaws.com"},"Condition":{"StringEquals":{"aws:SourceAccount":"${AWS::AccountId}"},"ArnLike":{"aws:SourceArn":"arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/*"}}},{"Effect":"Allow","Action":["logs:CreateLogStream","logs:PutLogEvents"],"Resource":["arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${EventBridgeLogs}:log-stream:*"],"Principal":{"Service":["events.amazonaws.com","delivery.logs.amazonaws.com"]}}]}'
          AlbAccessLogsDestination:
            Type: AWS::Logs::DeliveryDestination
            Properties:
              Name:
                Fn::Sub: ${AWS::StackName}-albaccesslogs
