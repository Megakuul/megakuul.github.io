#cloud-config
package_update: true
packages:
- nginx
- awscli-2
ssh_pwauth: false
disable_root: true
write_files:
- path: /etc/bootstrap.env
  owner: root:root
  permissions: '0600'
  defer: true
  content: |
    REGION=eu-central-1
    BUCKET=my-artifacts-111122223333
    PREFIX=website/
- path: /etc/nginx/nginx.conf
  owner: root:root
  permissions: '0644'
  defer: true
  content: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /run/nginx.pid;
    events { worker_connections 1024; }
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        access_log /var/log/nginx/access.log;
        sendfile on;
        include /etc/nginx/conf.d/*.conf;
    }
- path: /etc/nginx/conf.d/app.conf
  owner: root:root
  permissions: '0644'
  defer: true
  content: |
    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html/site;
        server_tokens off;
        add_header X-Content-Type-Options nosniff always;
        location / { try_files $uri $uri/ =404; }
    }
- path: /usr/local/sbin/bootstrap-website
  owner: root:root
  permissions: '0700'
  defer: true
  content: |
    #!/bin/bash
    set -euo pipefail
    source /etc/bootstrap.env
    export AWS_DEFAULT_REGION="$REGION" AWS_PAGER="" AWS_RETRY_MODE=standard AWS_MAX_ATTEMPTS=10
    [[ -n "$PREFIX" && "$PREFIX" != / && "$PREFIX" == */ ]]
    install -d -m 0755 /usr/share/nginx/html/site
    aws s3 sync "s3://$BUCKET/$PREFIX" /usr/share/nginx/html/site --only-show-errors --no-follow-symlinks
    find /usr/share/nginx/html/site -type d -exec chmod 0755 {} +
    find /usr/share/nginx/html/site -type f -exec chmod 0644 {} +
    restorecon -RF /usr/share/nginx/html/site
    nginx -t
    systemctl enable --now nginx
    systemctl is-active --quiet nginx
runcmd:
- - bash
  - -e
  - /usr/local/sbin/bootstrap-website
